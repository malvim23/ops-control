const ALERT_CFG_DEFAULT = {
  motSem: 2,        // faltas do mesmo motorista na mesma semana
  motMes: 3,        // faltas do mesmo motorista no mês
  motSemanasMes: 3, // semanas distintas do mês com falta do mesmo motorista
  repSem: 3,        // faltas na mesma loja na semana
  repCliSem: 5,     // faltas no mesmo cliente na semana
  repMes: 6,        // faltas na mesma loja no mês
  repCliMes: 10,    // faltas no mesmo cliente no mês
  aumPct: 50,       // % mínimo de aumento face ao período anterior (loja/cliente)
  aumMin: 2,        // aumento mínimo absoluto (nº de faltas)
  semMult: 1.5,     // semana/mês acima do habitual = média anterior × este fator
  semMin: 3,        // mínimo de faltas numa semana para alertar "acima do habitual"
  mesMin: 6,        // mínimo de faltas num mês para alertar "acima do habitual"
  abMin: 1,         // abandonos mínimos para alertar aumento
  semBkpSem: 2,     // faltas sem backup na mesma loja na semana
  semBkpMes: 4,     // faltas sem backup na mesma loja no mês
};
const ALERT_CFG_LABELS = {
  motSem: "Motorista: faltas na semana ≥", motMes: "Motorista: faltas no mês ≥", motSemanasMes: "Motorista: semanas com falta no mês ≥",
  repSem: "Loja: faltas na semana ≥", repCliSem: "Cliente: faltas na semana ≥", repMes: "Loja: faltas no mês ≥", repCliMes: "Cliente: faltas no mês ≥",
  aumPct: "Aumento vs período anterior (%) ≥", aumMin: "Aumento vs período anterior (nº) ≥",
  semMult: "Acima do habitual: fator × média anterior", semMin: "Semana: mínimo de faltas", mesMin: "Mês: mínimo de faltas",
  abMin: "Abandonos: mínimo para alertar", semBkpSem: "Loja: faltas sem backup na semana ≥", semBkpMes: "Loja: faltas sem backup no mês ≥",
};

function groupCount(recs, keyFn) {
  const m = new Map();
  recs.forEach((r) => { const k = keyFn(r); if (k === "" || k === undefined) return; let e = m.get(k); if (!e) { e = { k, n: 0, recs: [] }; m.set(k, e); } e.n++; e.recs.push(r); });
  return m;
}

// Alertas semanais e mensais calculados apenas com registos reais (nada estimado).
function computeAlerts(abs, periodMonths, loadMonths, monthHasData, cfg) {
  const alerts = [];
  const push = (a) => alerts.push(a);
  const sev = (val, thr) => (val >= thr * 2 ? "alta" : "média");
  const loadedFrom = `${loadMonths[0]}-01`;
  const lastLoaded = loadMonths[loadMonths.length - 1];
  const [ly, lm] = lastLoaded.split("-").map(Number);
  const loadedTo = isoDate(ly, lm - 1, daysInMonth(ly, lm - 1));
  const byWk = new Map();
  abs.forEach((r) => { let a = byWk.get(r.wk); if (!a) { a = []; byWk.set(r.wk, a); } a.push(r); });
  const wkComplete = (wk) => {
    if (wk < loadedFrom) return false;
    const end = dateKey(addDays(parseISO(wk), 6));
    if (end > loadedTo) return false;
    // só conta semanas cujos meses têm dados na grelha (evita "zeros" fictícios em meses vazios)
    return !!monthHasData[wk.slice(0, 7)] && !!monthHasData[end.slice(0, 7)];
  };
  const wkRecs = (wk) => byWk.get(wk) || [];
  const prevWk = (wk) => dateKey(addDays(parseISO(wk), -7));
  const fmtF = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");

  // ---------- SEMANAIS ----------
  const periodWeeks = new Set();
  periodMonths.forEach((mk) => weeksOfMonth(mk).forEach((w) => periodWeeks.add(w.wk)));
  [...periodWeeks].sort().forEach((wk) => {
    const rs = wkRecs(wk);
    if (!rs.length) return;
    const per = `Semana ${weekRangeLabel(wk)}${wkComplete(wk) ? "" : " (dados incompletos)"}`;
    const base = { scope: "Semanal", period: per, sortKey: wk };
    // Semana acima do habitual
    const prevCounts = [1, 2, 3, 4].map((i) => dateKey(addDays(parseISO(wk), -7 * i))).filter(wkComplete).map((k) => wkRecs(k).length);
    if (prevCounts.length >= 2) {
      const avg = prevCounts.reduce((a, b) => a + b, 0) / prevCounts.length;
      if (rs.length >= cfg.semMin && rs.length >= avg * cfg.semMult && rs.length > avg) {
        push({ ...base, kind: "Semana acima do habitual", sev: sev(rs.length, Math.max(1, avg * cfg.semMult)), title: `${rs.length} faltas na semana`, detail: `Média das ${prevCounts.length} semanas anteriores: ${fmtF(avg)} (limite: ×${cfg.semMult}, mín. ${cfg.semMin}).`, recs: rs });
      }
    }
    // Motoristas recorrentes na semana
    groupCount(rs, (r) => r.empId).forEach((e) => {
      if (e.n >= cfg.motSem) push({ ...base, kind: "Motorista com faltas recorrentes", sev: sev(e.n, cfg.motSem), title: `${e.recs[0].emp} · ${e.n} faltas`, detail: `Dias: ${[...new Set(e.recs.map((r) => pad2(r.day)))].sort().join(", ")} · ${e.recs[0].store}.`, recs: e.recs });
    });
    // Repetição na mesma loja / cliente
    groupCount(rs, (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.repSem) push({ ...base, kind: "Repetição na mesma loja", sev: sev(e.n, cfg.repSem), title: `${e.recs[0].store} · ${e.n} faltas`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    groupCount(rs, (r) => r.clientId).forEach((e) => {
      if (e.n >= cfg.repCliSem) push({ ...base, kind: "Repetição no mesmo cliente", sev: sev(e.n, cfg.repCliSem), title: `${e.recs[0].client} · ${e.n} faltas`, detail: "Total do cliente na semana (todas as lojas).", recs: e.recs });
    });
    // Sem backup
    groupCount(rs.filter((r) => r.cob === "sem"), (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.semBkpSem) push({ ...base, kind: "Ocorrências sem backup", sev: sev(e.n, cfg.semBkpSem), title: `${e.recs[0].store} · ${e.n} faltas sem backup`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    // Aumentos vs semana anterior (só se a semana anterior estiver completa nos dados)
    const pk = prevWk(wk);
    if (wkComplete(pk)) {
      const pr = wkRecs(pk);
      [["storeId", "store", "Aumento de faltas na loja"], ["clientId", "client", "Aumento de faltas no cliente"]].forEach(([idK, nameK, kind]) => {
        const prevMap = groupCount(pr, (r) => r[idK]);
        groupCount(rs, (r) => r[idK]).forEach((e) => {
          const p = prevMap.get(e.k) ? prevMap.get(e.k).n : 0;
          if (e.n - p >= cfg.aumMin && e.n >= p * (1 + cfg.aumPct / 100)) push({ ...base, kind, sev: sev(e.n - p, cfg.aumMin), title: `${e.recs[0][nameK]} · ${p} → ${e.n} faltas`, detail: `Semana anterior (${weekRangeLabel(pk)}): ${p}.`, recs: e.recs });
        });
      });
      const ab = rs.filter((r) => r.st === "Abandono"), abp = pr.filter((r) => r.st === "Abandono").length;
      if (ab.length >= cfg.abMin && ab.length > abp) push({ ...base, kind: "Aumento de abandonos", sev: sev(ab.length, Math.max(1, cfg.abMin)), title: `${ab.length} abandono(s) · antes ${abp}`, detail: `Semana anterior: ${abp}.`, recs: ab });
    }
  });

  // ---------- MENSAIS ----------
  periodMonths.forEach((mk) => {
    if (!monthHasData[mk]) return;
    const rs = abs.filter((r) => r.mk === mk);
    if (!rs.length) return;
    const base = { scope: "Mensal", period: monthLabelOf(mk), sortKey: mk };
    const pmk = shiftMonth(mk, -1);
    const prevOk = loadMonths.includes(pmk) && monthHasData[pmk];
    const pr = prevOk ? abs.filter((r) => r.mk === pmk) : [];
    // Mês acima do habitual
    const prevTot = [1, 2, 3].map((i) => shiftMonth(mk, -i)).filter((k) => loadMonths.includes(k) && monthHasData[k]).map((k) => abs.filter((r) => r.mk === k).length);
    if (prevTot.length >= 1) {
      const avg = prevTot.reduce((a, b) => a + b, 0) / prevTot.length;
      if (rs.length >= cfg.mesMin && rs.length >= avg * cfg.semMult && rs.length > avg) {
        push({ ...base, kind: "Mês acima do habitual", sev: sev(rs.length, Math.max(1, avg * cfg.semMult)), title: `${rs.length} faltas no mês`, detail: `Média dos ${prevTot.length} mês(es) anterior(es) com dados: ${fmtF(avg)} (limite: ×${cfg.semMult}, mín. ${cfg.mesMin}).`, recs: rs });
      }
    }
    // Motoristas
    groupCount(rs, (r) => r.empId).forEach((e) => {
      const nWk = new Set(e.recs.map((r) => r.wk)).size;
      if (e.n >= cfg.motMes) push({ ...base, kind: "Motorista com faltas recorrentes", sev: sev(e.n, cfg.motMes), title: `${e.recs[0].emp} · ${e.n} faltas no mês`, detail: `Em ${nWk} semana(s) distinta(s) · ${e.recs[0].store}.`, recs: e.recs });
      else if (nWk >= cfg.motSemanasMes) push({ ...base, kind: "Motorista com faltas recorrentes", sev: "média", title: `${e.recs[0].emp} · faltas em ${nWk} semanas`, detail: `${e.n} faltas · ${e.recs[0].store}.`, recs: e.recs });
    });
    // Repetição
    groupCount(rs, (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.repMes) push({ ...base, kind: "Repetição na mesma loja", sev: sev(e.n, cfg.repMes), title: `${e.recs[0].store} · ${e.n} faltas`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    groupCount(rs, (r) => r.clientId).forEach((e) => {
      if (e.n >= cfg.repCliMes) push({ ...base, kind: "Repetição no mesmo cliente", sev: sev(e.n, cfg.repCliMes), title: `${e.recs[0].client} · ${e.n} faltas`, detail: "Total do cliente no mês (todas as lojas).", recs: e.recs });
    });
    // Sem backup
    groupCount(rs.filter((r) => r.cob === "sem"), (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.semBkpMes) push({ ...base, kind: "Ocorrências sem backup", sev: sev(e.n, cfg.semBkpMes), title: `${e.recs[0].store} · ${e.n} faltas sem backup`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    // Aumentos vs mês anterior
    if (prevOk) {
      [["storeId", "store", "Aumento de faltas na loja"], ["clientId", "client", "Aumento de faltas no cliente"]].forEach(([idK, nameK, kind]) => {
        const prevMap = groupCount(pr, (r) => r[idK]);
        groupCount(rs, (r) => r[idK]).forEach((e) => {
          const p = prevMap.get(e.k) ? prevMap.get(e.k).n : 0;
          if (e.n - p >= cfg.aumMin && e.n >= p * (1 + cfg.aumPct / 100)) push({ ...base, kind, sev: sev(e.n - p, cfg.aumMin), title: `${e.recs[0][nameK]} · ${p} → ${e.n} faltas`, detail: `Mês anterior (${monthLabelOf(pmk)}): ${p}.`, recs: e.recs });
        });
      });
      const ab = rs.filter((r) => r.st === "Abandono"), abp = pr.filter((r) => r.st === "Abandono").length;
      if (ab.length >= cfg.abMin && ab.length > abp) push({ ...base, kind: "Aumento de abandonos", sev: sev(ab.length, Math.max(1, cfg.abMin)), title: `${ab.length} abandono(s) · antes ${abp}`, detail: `Mês anterior: ${abp}.`, recs: ab });
    }
  });
  return alerts.map((a, i) => ({ ...a, id: i }));
}

function AlertsPanel({ alerts, cfg, setCfg, periodLabel }) {
  const [openId, setOpenId] = useState(null);
  const [showAll, setShowAll] = useState({});
  const [showCfg, setShowCfg] = useState(false);
  const sevColor = { alta: "#ef4444", "média": "#f59e0b" };
  const groups = ["Semanal", "Mensal"].map((sc) => ({
    scope: sc,
    items: alerts.filter((a) => a.scope === sc).sort((a, b) => b.sortKey.localeCompare(a.sortKey) || (a.sev === b.sev ? 0 : a.sev === "alta" ? -1 : 1) || b.recs.length - a.recs.length),
  }));
  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
        <p className="text-xs text-gray-400 max-w-2xl">Alertas calculados automaticamente com os registos da grelha e dos backups para {periodLabel}. Os limites são critérios configuráveis (não são dados registados) e as comparações usam apenas períodos com dados.</p>
        <button onClick={() => setShowCfg((v) => !v)} className="px-3 py-1.5 rounded-lg text-sm font-semibold border border-[var(--border-c)] bg-white">{showCfg ? "Ocultar critérios" : "Critérios de alerta"}</button>
      </div>
      {showCfg && (
        <Card title="Critérios de alerta (configuráveis)" className="mb-5" right={<button onClick={() => setCfg({ ...ALERT_CFG_DEFAULT })} className="text-xs font-semibold text-[var(--accent)]">Repor valores por defeito</button>}>
          <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-x-5 gap-y-3">
            {Object.keys(ALERT_CFG_DEFAULT).map((k) => (
              <label key={k} className="flex items-center justify-between gap-3 text-xs text-gray-500">
                <span>{ALERT_CFG_LABELS[k]}</span>
                <input type="number" min="0" step={k === "semMult" ? "0.1" : "1"} value={cfg[k]} onChange={(e) => { const n = Number(e.target.value); setCfg({ ...cfg, [k]: Number.isFinite(n) ? n : ALERT_CFG_DEFAULT[k] }); }} className="w-20 px-2 py-1 rounded-lg border border-[var(--border-c)] text-sm text-right bg-white" />
              </label>
            ))}
          </div>
        </Card>
      )}
      <div className="grid lg:grid-cols-2 gap-5 items-start">
        {groups.map((g) => {
          const shown = showAll[g.scope] ? g.items : g.items.slice(0, 25);
          return (
            <Card key={g.scope} title={`Alertas ${g.scope === "Semanal" ? "semanais" : "mensais"}`} right={<span className="text-[11px] text-gray-400">{g.items.length} alerta(s) · {g.items.filter((a) => a.sev === "alta").length} de gravidade alta</span>}>
              {g.items.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">Sem alertas com os critérios atuais.</div> : (
                <div className="space-y-2">
                  {shown.map((a) => (
                    <div key={a.id} className="rounded-xl border border-[var(--border-c)] overflow-hidden" style={{ borderLeft: `4px solid ${sevColor[a.sev]}` }}>
                      <button onClick={() => setOpenId(openId === a.id ? null : a.id)} className="w-full text-left px-3 py-2.5 hover:bg-gray-50">
                        <div className="flex items-center gap-2 flex-wrap mb-1">
                          <Pill color={sevColor[a.sev]}>{a.sev === "alta" ? "Alta" : "Média"}</Pill>
                          <span className="text-[11px] font-bold text-gray-500">{a.kind}</span>
                          <span className="text-[11px] text-gray-400 ml-auto">{a.period}</span>
                        </div>
                        <div className="text-sm font-bold break-words">{a.title}</div>
                        <div className="text-xs text-gray-400 break-words">{a.detail}</div>
                      </button>
                      {openId === a.id && <div className="px-3 pb-3"><OccurrenceTable items={a.recs} maxH={240} /></div>}
                    </div>
                  ))}
                  {g.items.length > 25 && (
                    <button onClick={() => setShowAll((p) => ({ ...p, [g.scope]: !p[g.scope] }))} className="w-full py-2 text-xs font-semibold text-[var(--accent)]">{showAll[g.scope] ? "Mostrar menos" : `Mostrar todos (${g.items.length})`}</button>
                  )}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function RankSection({ title, rows, selected, onSelect, showParent, emptyText }) {
  const top = rows.slice(0, 10);
  const chart = {
    labels: top.map((r) => r.nome),
    datasets: [
      { label: "Falta", data: top.map((r) => r.c.falta), backgroundColor: "#ef4444" },
      { label: "Meia Falta", data: top.map((r) => r.c.meia), backgroundColor: "#f59e0b" },
      { label: "Abandono", data: top.map((r) => r.c.abandono), backgroundColor: "#7f1d1d" },
    ],
  };
  const sel = rows.find((r) => r.id === selected);
  const td = "px-3 py-2 border-b border-[var(--border-c)] text-center tabular-nums";
  return (
    <Card title={title} className="mb-5">
      {rows.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">{emptyText}</div> : (
        <>
          <div className="mb-4"><ChartCanvas type="bar" data={chart} options={hBarStackOpts} height={Math.max(140, 60 + top.length * 30)} /></div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs min-w-[820px]">
              <thead>
                <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                  <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">#</th>
                  <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">{showParent ? "Loja" : "Cliente"}</th>
                  {showParent && <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Cliente</th>}
                  {["Faltas", "Meias", "Abandonos", "Total", "C/ Bkp Int.", "C/ Bkp Ext.", "Sem backup", "% sem bkp"].map((h) => <th key={h} className="px-3 py-2 border-b border-[var(--border-c)]">{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const t = totalFaltas(r.c);
                  return (
                    <tr key={r.id} onClick={() => onSelect(selected === r.id ? null : r.id)} className={`cursor-pointer hover:bg-gray-50/60 ${selected === r.id ? "bg-gray-50" : ""}`}>
                      <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-400">{i + 1}</td>
                      <td className="px-3 py-2 border-b border-[var(--border-c)] font-bold">{r.nome}</td>
                      {showParent && <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-500">{r.parent}</td>}
                      <td className={td}>{r.c.falta}</td><td className={td}>{r.c.meia}</td><td className={td}>{r.c.abandono}</td>
                      <td className={td + " font-extrabold"}>{t}</td>
                      <td className={td} style={r.c.cInt > 0 ? { color: "#0d9488", fontWeight: 700 } : {}}>{r.c.cInt}</td>
                      <td className={td} style={r.c.cExt > 0 ? { color: "#d97706", fontWeight: 700 } : {}}>{r.c.cExt}</td>
                      <td className={td} style={r.c.sem > 0 ? { color: "#ef4444", fontWeight: 700 } : {}}>{r.c.sem}</td>
                      <td className={td}>{t > 0 ? `${Math.round((r.c.sem / t) * 100)}%` : "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {sel && (
            <div className="mt-4">
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-bold">Ocorrências · {sel.nome} <span className="text-gray-400 font-normal">({sel.recs.length})</span></div>
                <button onClick={() => onSelect(null)} className="text-xs font-semibold text-gray-500">Fechar</button>
              </div>
              <OccurrenceTable items={sel.recs} />
            </div>
          )}
        </>
      )}
    </Card>
  );
}

function AnalysesView({ stores, employees, clients, getScheduleForMonth, monthOptions, refsReady }) {
  const lastMonth = monthOptions[monthOptions.length - 1];
  const [tab, setTab] = useState("motoristas");
  const [period, setPeriod] = useState(lastMonth);
  const [fWeek, setFWeek] = useState("");
  const [fCliente, setFCliente] = useState("");
  const [fLoja, setFLoja] = useState("");
  const [fEmp, setFEmp] = useState("");
  const [fTipo, setFTipo] = useState("");
  const [selEmp, setSelEmp] = useState(null);
  const [selCli, setSelCli] = useState(null);
  const [selLoja, setSelLoja] = useState(null);
  const [cfg, setCfgState] = useState(() => {
    try { const raw = localStorage.getItem("opsAlertCfg"); return raw ? { ...ALERT_CFG_DEFAULT, ...JSON.parse(raw) } : { ...ALERT_CFG_DEFAULT }; } catch (e) { return { ...ALERT_CFG_DEFAULT }; }
  });
  const setCfg = useCallback((c) => { setCfgState(c); try { localStorage.setItem("opsAlertCfg", JSON.stringify(c)); } catch (e) {} }, []);

  const periodMonths = useMemo(() => (period.startsWith("ult") ? monthWindow(lastMonth, Number(period.slice(3))) : [period]), [period, lastMonth]);
  // carrega também 3 meses anteriores ao período (base de comparação dos alertas / variações)
  const loadMonths = useMemo(() => [...new Set([...monthWindow(periodMonths[0], 4), ...periodMonths])].sort(), [periodMonths]);
  const data = useOpsData({ months: loadMonths, stores, employees, clients, getScheduleForMonth, enabled: refsReady });
  const loading = data.status === "loading";

  const abs = useMemo(() => data.recs.filter((r) => ABS_TYPES.includes(r.st)), [data.recs]);
  const scoped = useMemo(() => abs.filter((r) => (!fCliente || r.clientId === fCliente) && (!fLoja || r.storeId === fLoja) && (!fEmp || r.empId === fEmp)), [abs, fCliente, fLoja, fEmp]);
  const inPeriod = useMemo(() => {
    const set = new Set(periodMonths);
    return scoped.filter((r) => set.has(r.mk) && (!fWeek || r.wk === fWeek) && (!fTipo || r.st === fTipo));
  }, [scoped, periodMonths, fWeek, fTipo]);

  // Células de backup da grelha (interno / externo / pool) no mesmo âmbito -> contam como "faltas com backup"
  const BKP_ST = ["Backup Interno", "Backup Externo", "Pool"];
  const inPeriodBk = useMemo(() => {
    if (fTipo) return [];
    const set = new Set(periodMonths);
    return data.recs.filter((r) => BKP_ST.includes(r.st) && set.has(r.mk) && (!fWeek || r.wk === fWeek) && (!fCliente || r.clientId === fCliente) && (!fLoja || r.storeId === fLoja) && (!fEmp || r.empId === fEmp));
  }, [data.recs, periodMonths, fWeek, fTipo, fCliente, fLoja, fEmp]);

  const singleMonth = periodMonths.length === 1 ? periodMonths[0] : null;
  const weekOptions = useMemo(() => (singleMonth ? weeksOfMonth(singleMonth) : []), [singleMonth]);
  const storeOptions = useMemo(() => stores.filter((s) => !fCliente || s.clienteId === fCliente).sort((a, b) => a.nome.localeCompare(b.nome)), [stores, fCliente]);
  const empOptions = useMemo(() => [...employees].sort((a, b) => a.nome.localeCompare(b.nome)), [employees]);
  const periodLabel = period.startsWith("ult") ? `Últimos ${period.slice(3)} meses (${monthShort(periodMonths[0])} – ${monthShort(periodMonths[periodMonths.length - 1])})` : monthLabelOf(period);

  const onPeriod = (v) => { setPeriod(v); setFWeek(""); };
  const onCliente = (v) => { setFCliente(v); setFLoja(""); };

  // -------- 3.1 Motoristas --------
  const empRows = useMemo(() => {
    const map = new Map();
    inPeriod.forEach((r) => {
      let e = map.get(r.empId);
      if (!e) { e = { id: r.empId, nome: r.emp, store: r.store, client: r.client, c: emptyCounts(), weeks: new Set(), months: new Set(), last: "", recs: [] }; map.set(r.empId, e); }
      addRec(e.c, r); e.weeks.add(r.wk); e.months.add(r.mk); e.recs.push(r);
      if (r.date >= e.last) { e.last = r.date; e.store = r.store; e.client = r.client; }
    });
    return [...map.values()].sort((a, b) => totalFaltas(b.c) - totalFaltas(a.c) || a.nome.localeCompare(b.nome));
  }, [inPeriod]);
  const empChart = useMemo(() => {
    const top = empRows.slice(0, 10);
    return { labels: top.map((r) => r.nome), datasets: [
      { label: "Falta", data: top.map((r) => r.c.falta), backgroundColor: "#ef4444" },
      { label: "Meia Falta", data: top.map((r) => r.c.meia), backgroundColor: "#f59e0b" },
      { label: "Abandono", data: top.map((r) => r.c.abandono), backgroundColor: "#7f1d1d" },
    ] };
  }, [empRows]);
  const recurrence = useMemo(() => empRows.slice(0, 10).map((e) => ({ e, per: periodMonths.map((mk) => e.recs.filter((r) => r.mk === mk).length) })), [empRows, periodMonths]);
  const recMax = Math.max(1, ...recurrence.flatMap((r) => r.per));

  // Histórico individual: todos os meses carregados (ignora período/semana/tipo; respeita apenas o motorista)
  const histRecs = useMemo(() => (selEmp ? abs.filter((r) => r.empId === selEmp) : []), [abs, selEmp]);
  const histInfo = useMemo(() => {
    if (!selEmp) return null;
    const c = countRecs(histRecs);
    const byMonth = loadMonths.map((mk) => countRecs(histRecs.filter((r) => r.mk === mk)));
    const days = {};
    histRecs.forEach((r) => { (days[r.mk] = days[r.mk] || []).push(r.day); });
    const dow = [0, 0, 0, 0, 0, 0, 0];
    histRecs.forEach((r) => { dow[r.dow]++; });
    const weeks = [...new Set(histRecs.map((r) => r.wk))].sort();
    return { c, byMonth, days, dow, weeks };
  }, [histRecs, selEmp, loadMonths]);
  const selEmpName = selEmp ? (employees.find((e) => e.id === selEmp)?.nome || (histRecs[0] && histRecs[0].emp) || "—") : "";

  // -------- 3.2 Clientes / Lojas (rankings separados) --------
  const rankBy = (idFn, nameFn, parentFn) => {
    const map = new Map();
    inPeriod.concat(inPeriodBk).forEach((r) => {
      const id = idFn(r);
      let e = map.get(id);
      if (!e) { e = { id, nome: nameFn(r), parent: parentFn ? parentFn(r) : "", c: emptyCounts(), recs: [] }; map.set(id, e); }
      addRec(e.c, r); e.recs.push(r);
    });
    return [...map.values()].filter((e) => totalFaltas(e.c) > 0).sort((a, b) => totalFaltas(b.c) - totalFaltas(a.c) || a.nome.localeCompare(b.nome));
  };
  const cliRows = useMemo(() => rankBy((r) => r.clientId || "_none", (r) => r.client), [inPeriod, inPeriodBk]);
  const lojaRows = useMemo(() => rankBy((r) => r.storeId || "_none", (r) => r.store, (r) => r.client), [inPeriod, inPeriodBk]);

  // -------- 3.3 Alertas (ignora filtro de tipo e de semana no cálculo base) --------
  const alertsAll = useMemo(() => computeAlerts(scoped, periodMonths, loadMonths, data.monthHasData, cfg), [scoped, periodMonths, loadMonths, data.monthHasData, cfg]);
  const alerts = useMemo(() => alertsAll.filter((a) => !(fWeek && a.scope === "Semanal" && a.sortKey !== fWeek)), [alertsAll, fWeek]);

  const noData = !loading && data.status === "ready" && !periodMonths.some((mk) => data.monthHasData[mk]);
  const kpi = useMemo(() => countRecs(inPeriod), [inPeriod]);

  return (
    <div className="p-4 md:p-8 fade-in">
      <h1 className="text-2xl font-extrabold">Análises</h1>
      <p className="text-sm text-gray-400 mb-5">Recorrência de faltas, ranking de clientes e lojas e alertas operacionais · {periodLabel}</p>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        <select value={period} onChange={(e) => onPeriod(e.target.value)} className={filterSelCls} title="Período">
          <optgroup label="Mês">{[...monthOptions].reverse().map((mk) => <option key={mk} value={mk}>{monthLabelOf(mk)}</option>)}</optgroup>
          <optgroup label="Intervalo"><option value="ult3">Últimos 3 meses</option><option value="ult6">Últimos 6 meses</option><option value="ult12">Últimos 12 meses</option></optgroup>
        </select>
        <select value={fWeek} onChange={(e) => setFWeek(e.target.value)} disabled={!singleMonth} className={filterSelCls + (singleMonth ? "" : " opacity-50")} title="Semana (disponível quando o período é um único mês)">
          <option value="">Todas as semanas</option>
          {weekOptions.map((w) => <option key={w.wk} value={w.wk}>{w.label}</option>)}
        </select>
        <select value={fCliente} onChange={(e) => onCliente(e.target.value)} className={filterSelCls}>
          <option value="">Todos os Clientes</option>
          {clients.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
        <select value={fLoja} onChange={(e) => setFLoja(e.target.value)} className={filterSelCls}>
          <option value="">Todas as Lojas</option>
          {storeOptions.map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}
        </select>
        <select value={fEmp} onChange={(e) => setFEmp(e.target.value)} className={filterSelCls}>
          <option value="">Todos os Motoristas</option>
          {empOptions.map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
        </select>
        <select value={fTipo} onChange={(e) => setFTipo(e.target.value)} className={filterSelCls} title="Não afeta o cálculo dos alertas">
          <option value="">Todas as ocorrências</option>
          {ABS_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
      </div>

      <div className="flex gap-1 bg-gray-100 rounded-lg p-1 w-fit max-w-full overflow-x-auto mb-5">
        {[["motoristas", "Motoristas"], ["clientes", "Clientes e Lojas"], ["alertas", "Alertas"]].map(([k, l]) => (
          <button key={k} onClick={() => setTab(k)} className={`px-4 py-1.5 rounded-md text-sm font-semibold whitespace-nowrap ${tab === k ? "bg-white shadow text-[var(--text-primary)]" : "text-gray-500"}`}>{l}</button>
        ))}
      </div>

      {(loading || data.status === "error") && <StateBox status={data.status} error={data.error} onRetry={data.reload} />}
      {noData && <StateBox status="ready" empty emptyText={`Sem dados registados na grelha para ${periodLabel}.`} />}

      {!loading && data.status === "ready" && !noData && (
        <>
          {tab !== "alertas" && (
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
              <MiniStat label="Total de faltas" value={totalFaltas(kpi)} sub="Falta + Meia + Abandono" color="#ef4444" />
              <MiniStat label="Faltas completas" value={kpi.falta} color="#ef4444" />
              <MiniStat label="Meias faltas" value={kpi.meia} color="#f59e0b" />
              <MiniStat label="Abandonos" value={kpi.abandono} color="#b91c1c" />
            </div>
          )}

          {tab === "motoristas" && (
            <>
              <Card title="Motoristas com mais faltas" className="mb-5" right={<span className="text-[11px] text-gray-400">Top 10 · clique numa linha para o histórico</span>}>
                {empRows.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">Sem faltas para os filtros selecionados.</div> : (
                  <>
                    <div className="mb-4"><ChartCanvas type="bar" data={empChart} options={hBarStackOpts} height={Math.max(140, 60 + Math.min(10, empRows.length) * 30)} /></div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs min-w-[820px]">
                        <thead>
                          <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">#</th>
                            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Motorista</th>
                            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Cliente · Loja (última ocorrência)</th>
                            {["Faltas", "Meias", "Abandonos", "Total", "Sem backup", "Semanas", "Meses", "Última"].map((h) => <th key={h} className="px-3 py-2 border-b border-[var(--border-c)]">{h}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          {empRows.map((r, i) => {
                            const td = "px-3 py-2 border-b border-[var(--border-c)] text-center tabular-nums";
                            return (
                              <tr key={r.id} onClick={() => setSelEmp(selEmp === r.id ? null : r.id)} className={`cursor-pointer hover:bg-gray-50/60 ${selEmp === r.id ? "bg-gray-50" : ""}`}>
                                <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-400">{i + 1}</td>
                                <td className="px-3 py-2 border-b border-[var(--border-c)] font-bold">{r.nome}</td>
                                <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-500">{r.client} · {r.store}</td>
                                <td className={td}>{r.c.falta}</td><td className={td}>{r.c.meia}</td><td className={td}>{r.c.abandono}</td>
                                <td className={td + " font-extrabold"}>{totalFaltas(r.c)}</td>
                                <td className={td} style={r.c.sem > 0 ? { color: "#ef4444", fontWeight: 700 } : {}}>{r.c.sem}</td>
                                <td className={td}>{r.weeks.size}</td><td className={td}>{r.months.size}</td>
                                <td className={td + " whitespace-nowrap"}>{fmtDMY(r.last)}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </Card>

              {recurrence.length > 0 && (
                <Card title="Recorrência mensal · Top 10" className="mb-5" right={<span className="text-[11px] text-gray-400">Faltas por mês no período</span>}>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs" style={{ minWidth: 220 + periodMonths.length * 64 }}>
                      <thead>
                        <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                          <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Motorista</th>
                          {periodMonths.map((mk) => <th key={mk} className="px-2 py-2 border-b border-[var(--border-c)] whitespace-nowrap">{monthShort(mk)}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {recurrence.map(({ e, per }) => (
                          <tr key={e.id}>
                            <td className="px-3 py-1 border-b border-[var(--border-c)] font-semibold whitespace-nowrap">{e.nome}</td>
                            {per.map((n, i) => (
                              <td key={i} className="px-1 py-1 border-b border-[var(--border-c)]">
                                <div className="rounded-md h-7 flex items-center justify-center font-bold tabular-nums" style={n ? { background: `rgba(239,68,68,${0.12 + 0.75 * (n / recMax)})`, color: n / recMax > 0.55 ? "#fff" : "#991b1b" } : { color: "#9ca3af" }}>{n}</div>
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </Card>
              )}

              {selEmp && histInfo && (
                <Card title={`Histórico individual · ${selEmpName}`} className="mb-5" right={<button onClick={() => setSelEmp(null)} className="text-xs font-semibold text-gray-500">Fechar</button>}>
                  <p className="text-[11px] text-gray-400 mb-3">Todos os meses carregados ({monthShort(loadMonths[0])} – {monthShort(loadMonths[loadMonths.length - 1])}), independentemente dos filtros de período, semana e tipo. Escolha “Últimos 12 meses” para um histórico mais longo.</p>
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-4">
                    <MiniStat label="Total" value={totalFaltas(histInfo.c)} color="#ef4444" />
                    <MiniStat label="Faltas" value={histInfo.c.falta} />
                    <MiniStat label="Meias faltas" value={histInfo.c.meia} />
                    <MiniStat label="Abandonos" value={histInfo.c.abandono} />
                    <MiniStat label="Sem backup" value={histInfo.c.sem} color="#ef4444" />
                  </div>
                  {histRecs.length === 0 ? <div className="text-sm text-gray-400 py-4 text-center">Sem faltas registadas nos meses carregados.</div> : (
                    <>
                      <div className="grid lg:grid-cols-2 gap-5 mb-4">
                        <div>
                          <div className="text-xs font-bold text-gray-500 mb-2">Faltas por mês</div>
                          <ChartCanvas type="bar" data={{ labels: loadMonths.map(monthShort), datasets: [
                            { label: "Falta", data: histInfo.byMonth.map((c) => c.falta), backgroundColor: "#ef4444" },
                            { label: "Meia Falta", data: histInfo.byMonth.map((c) => c.meia), backgroundColor: "#f59e0b" },
                            { label: "Abandono", data: histInfo.byMonth.map((c) => c.abandono), backgroundColor: "#7f1d1d" },
                          ] }} options={barStackOpts} height={200} />
                        </div>
                        <div>
                          <div className="text-xs font-bold text-gray-500 mb-2">Dias e semanas</div>
                          <div className="space-y-1.5 text-xs text-gray-500 max-h-[200px] overflow-auto pr-1">
                            {Object.keys(histInfo.days).sort().map((mk) => (
                              <div key={mk}><b className="text-[var(--text-primary)]">{monthLabelOf(mk)}:</b> dias {[...new Set(histInfo.days[mk])].sort((a, b) => a - b).join(", ")}</div>
                            ))}
                            <div className="pt-1"><b className="text-[var(--text-primary)]">Semanas:</b> {histInfo.weeks.map(weekRangeLabel).join(" · ")}</div>
                            <div><b className="text-[var(--text-primary)]">Dia da semana:</b> {DIAS_SEMANA.map((d, i) => `${d} ${histInfo.dow[i]}`).join(" · ")}</div>
                          </div>
                        </div>
                      </div>
                      <OccurrenceTable items={histRecs} />
                    </>
                  )}
                </Card>
              )}
            </>
          )}

          {tab === "clientes" && (
            <>
              <RankSection title="Ranking por Cliente" rows={cliRows} selected={selCli} onSelect={setSelCli} emptyText="Sem faltas para os filtros selecionados." />
              <RankSection title="Ranking por Loja" rows={lojaRows} selected={selLoja} onSelect={setSelLoja} showParent emptyText="Sem faltas para os filtros selecionados." />
              <p className="text-[11px] text-gray-400 leading-relaxed">Cada célula da grelha marcada como Backup Interno (incluindo atribuições da loja pool, contadas na loja coberta) ou Backup Externo conta como uma falta com backup interno/externo. “Sem backup” = faltas sem nenhum backup da mesma loja no mesmo dia, semana ou mês (cada backup cobre uma única falta).</p>
            </>
          )}

          {tab === "alertas" && <AlertsPanel alerts={alerts} cfg={cfg} setCfg={setCfg} periodLabel={periodLabel} />}
        </>
      )}
    </div>
  );
}

function CellStatusMenu({ anchorRect, value, onSelect, onClose }) {
  const [pos, setPos] = useState(null);

  useEffect(() => {
    const menuW = 190;
    const menuH = STATUS_OPTIONS.filter(o => o.value).length * 38 + 60;
    let top = anchorRect.bottom + 6;
    let left = anchorRect.left;
    if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
    if (top + menuH > window.innerHeight - 8) top = anchorRect.top - menuH - 6;
    setPos({ top, left, width: Math.max(anchorRect.width, menuW) });
  }, [anchorRect]);

  useEffect(() => {
    const onKey = (ev) => { if (ev.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  if (!pos) return null;

  return ReactDOM.createPortal(
    <>
      <div className="fixed inset-0 z-40" onMouseDown={onClose}></div>
      <div className="fixed z-50 bg-white rounded-xl shadow-2xl border border-[var(--border-c)] py-1.5 fade-in" style={{ top: pos.top, left: pos.left, width: pos.width }} onMouseDown={(e)=>e.stopPropagation()}>
        {STATUS_OPTIONS.filter(o => o.value).map(o => (
          <button key={o.value} onClick={() => onSelect(o.value)}
            className={`w-full flex items-center gap-2.5 px-3.5 py-2 text-sm text-left hover:bg-gray-50 ${value === o.value ? "bg-gray-50 font-semibold" : ""}`}>
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: o.dot }}></span>
            <span>{o.label}</span>
          </button>
        ))}
        <div className="border-t border-[var(--border-c)] mt-1 pt-1">
          <button onClick={() => onSelect("")} className="w-full flex items-center gap-2.5 px-3.5 py-2 text-sm text-left text-gray-400 hover:bg-gray-50">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: "#e5e7eb" }}></span>
            <span>Limpar</span>
          </button>
        </div>
      </div>
    </>,
    document.body
  );
}

function GridView({ stores, employees, clients, getScheduleForMonth, saveCellStatus, getArrivalsForMonth, saveArrivalTime }) {
  const now = new Date();
  const [y, setY] = useState(now.getFullYear());
  const [m, setM] = useState(now.getMonth());
  const [schedule, setSchedule] = useState({});
  const [arrivals, setArrivals] = useState({});
  const [loading, setLoading] = useState(true);
  const [fLoja, setFLoja] = useState("");
  const [fCliente, setFCliente] = useState("");
  const [fTurno, setFTurno] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [editingCell, setEditingCell] = useState(null);
  const [exporting, setExporting] = useState(false);
  const gridScrollRef = useRef(null);
  // Altura real (em px) da 1ª linha do cabeçalho (nomes das lojas), medida
  // dinamicamente — evita usar um valor fixo (ex.: 28px) como "top" da 2ª
  // linha (nomes dos colaboradores), que ficava desalinhado sempre que essa
  // linha tinha uma altura diferente (ex.: lojas com muitos colaboradores).
  const gridHeadRow1Ref = useRef(null);
  const [gridHeadRow2Top, setGridHeadRow2Top] = useState(28);

  const mk = monthKey(y, m);
  useEffect(() => {
    let alive = true;
    setLoading(true);
    Promise.all([getScheduleForMonth(mk), getArrivalsForMonth(mk)]).then(([s, a]) => {
      if (alive) { setSchedule(s); setArrivals(a); setLoading(false); }
    });
    return () => { alive = false; };
  }, [mk]);

  const setArrival = async (storeId, day, value) => {
    const key = arrivalKey(storeId, day);
    setArrivals(prev => ({ ...prev, [key]: value }));
    await saveArrivalTime(mk, storeId, day, value);
  };

  const nDays = daysInMonth(y, m);
  const days = Array.from({ length: nDays }, (_, i) => i + 1);

  const activeEmployees = useMemo(() => employees.filter(e => e.estado !== "Desligado"), [employees]);
  const storesSorted = useMemo(() => [...stores].sort((a,b)=> (a.ordem??0)-(b.ordem??0) || a.nome.localeCompare(b.nome)), [stores]);

  const visibleStores = storesSorted.filter(s => (!fLoja || s.id === fLoja) && (!fCliente || s.clienteId === fCliente));
  const empByStore = (storeId) => activeEmployees.filter(e => e.lojaId === storeId && (!fTurno || e.turno === fTurno));
  const storeById = (id) => stores.find(s => s.id === id);

  useEffect(() => {
    const rowEl = gridHeadRow1Ref.current;
    if (!rowEl) return;
    const updateHeight = () => {
      const h = rowEl.getBoundingClientRect().height;
      if (h > 0) setGridHeadRow2Top(h);
    };
    updateHeight();
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(updateHeight);
    ro.observe(rowEl);
    return () => ro.disconnect();
  }, [visibleStores.length, activeEmployees.length, fLoja, fCliente, fTurno]);

  // Loja "Backup Interno" (pool): a célula não mostra status, mostra a lista de lojas do mesmo cliente
  const poolOptionsFor = (store) => stores
    .filter(s => s.id !== store.id && s.clienteId && s.clienteId === store.clienteId)
    .sort((a,b)=>a.nome.localeCompare(b.nome))
    .map(s => ({ id: s.id, nome: s.nome, cor: s.cor }));

  // Folga fixa: se a célula não tem valor guardado e o colaborador tem esse dia da semana marcado
  // como folga fixa no cadastro, mostra "Folga" automaticamente (sem precisar preencher célula a célula).
  const effectiveValue = (emp, day) => {
    const saved = schedule[cellKey(emp.id, day)];
    if (saved) return saved;
    const dow = new Date(y, m, day).getDay();
    if ((emp.folgaFixa || []).includes(dow)) return "Folga";
    return "";
  };

  const setCell = async (empId, day, value) => {
    const prevVal = schedule[cellKey(empId, day)] || "";
    setSchedule(prev => ({ ...prev, [cellKey(empId, day)]: value }));
    setEditingCell(null);
    await saveCellStatus(mk, empId, day, value);
    const emp = employees.find(x => x.id === empId);
    const store = editingCell?.store;
    const fromLabel = store?.tipo === "backup_pool" ? (storeById(prevVal)?.nome || (prevVal || "—")) : (statusMeta(prevVal).label);
    const toLabel = store?.tipo === "backup_pool" ? (storeById(value)?.nome || (value || "—")) : (statusMeta(value).label);
    logHistory("Editou", "Grelha", emp?.nome || "—", `${MESES[m]}/${y}, dia ${day}: "${fromLabel}" → "${toLabel}"`);
  };

  const openCellMenu = (e, empId, day, store) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setEditingCell({ key: cellKey(empId, day), empId, day, rect, isPool: store.tipo === "backup_pool", store });
  };

  const changeMonth = (delta) => {
    let nm = m + delta, ny = y;
    if (nm < 0) { nm = 11; ny -= 1; }
    if (nm > 11) { nm = 0; ny += 1; }
    setM(nm); setY(ny);
  };

  // Captura a grelha inteira (incluindo cabeçalhos fixos e todas as linhas,
  // mesmo as que estão fora da área visível de scroll) e faz download em PNG.
  const handleDownloadGridPNG = async () => {
    const el = gridScrollRef.current;
    if (!el) return;
    if (typeof html2canvas === "undefined") {
      alert("Não foi possível gerar a imagem: a biblioteca de exportação ainda não carregou. Verifica a ligação à internet e tenta novamente em alguns segundos.");
      return;
    }

    setExporting(true);

    // 1) Remove temporariamente o limite de altura e o scroll do contentor,
    //    para que TODAS as linhas (mesmo as que estão fora do scroll) fiquem
    //    presentes no layout normal do documento.
    const prevMaxHeight = el.style.maxHeight;
    const prevOverflow = el.style.overflow;
    el.style.maxHeight = "none";
    el.style.overflow = "visible";

    // 2) Neutraliza position:sticky (cabeçalhos e coluna "DIA") — sem um
    //    contentor com scroll, o sticky pode "colar-se" ao viewport e
    //    estragar a captura. Guarda o valor original de cada elemento para
    //    repor depois.
    const stickyEls = Array.from(el.querySelectorAll("*")).filter(
      (n) => getComputedStyle(n).position === "sticky"
    );
    const stickyOriginal = stickyEls.map((n) => n.style.position);
    stickyEls.forEach((n) => { n.style.position = "static"; });

    // Força reflow antes de capturar
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    try {
      const canvas = await html2canvas(el, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight,
      });
      const nomeFicheiro = `grelha-${MESES[m]}-${y}`
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      const link = document.createElement("a");
      link.download = `${nomeFicheiro}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    } catch (err) {
      console.error("Erro ao gerar PNG da grelha:", err);
      alert("Ocorreu um erro ao gerar a imagem da grelha.");
    } finally {
      // 3) Repõe tudo como estava
      stickyEls.forEach((n, i) => { n.style.position = stickyOriginal[i] || ""; });
      el.style.maxHeight = prevMaxHeight;
      el.style.overflow = prevOverflow;
      setExporting(false);
    }
  };

  return (
    <div className="p-8 fade-in">
      <div className="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-extrabold">Grelha Operacional</h1>
          <p className="text-sm text-gray-400">Escala mensal de presenças por loja e turno</p>
        </div>
        <div className="flex items-center gap-2">
          <select value={fCliente} onChange={(e)=>setFCliente(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os Clientes</option>
            {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
          <select value={fLoja} onChange={(e)=>setFLoja(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todas as Lojas</option>
            {storesSorted.map(s => <option key={s.id} value={s.id}>{s.nome}</option>)}
          </select>
          <select value={fTurno} onChange={(e)=>setFTurno(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os Turnos</option>
            {TURNOS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          <select value={fStatus} onChange={(e)=>setFStatus(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os Status</option>
            {STATUS_OPTIONS.filter(s=>s.value).map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
          </select>
        </div>
      </div>

      <div className="flex items-center gap-3 mb-3">
        <button onClick={()=>changeMonth(-1)} className="p-1.5 rounded-lg border border-[var(--border-c)] bg-white hover:bg-gray-50"><Icon path={ICONS.chevronLeft} size={16} /></button>
        <span className="font-bold text-sm w-32 text-center">{MESES[m]} {y}</span>
        <button onClick={()=>changeMonth(1)} className="p-1.5 rounded-lg border border-[var(--border-c)] bg-white hover:bg-gray-50"><Icon path={ICONS.chevronRight} size={16} /></button>
        <button
          onClick={handleDownloadGridPNG}
          disabled={exporting || loading}
          className="ml-auto flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold text-white disabled:opacity-60 disabled:cursor-not-allowed"
          style={{ background: "var(--accent)" }}
          title="Captura a grelha inteira (incluindo linhas fora do scroll) e faz download em PNG"
        >
          {exporting ? (
            <Icon path={ICONS.refresh || "M4 4v6h6M20 20v-6h-6M4 10a8 8 0 0114-5.3M20 14a8 8 0 01-14 5.3"} size={14} className="spin" />
          ) : (
            <Icon path={ICONS.download || "M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"} size={14} />
          )}
          {exporting ? "A gerar imagem…" : "Baixar PNG"}
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-[var(--border-c)] overflow-hidden">
        {loading ? (
          <div className="p-16 text-center text-gray-300 text-sm">A carregar grelha…</div>
        ) : (
          <div ref={gridScrollRef} className="overflow-auto grid-scroll" style={{ maxHeight: "72vh" }}>
            <table className="text-xs w-full">
              <thead>
                <tr ref={gridHeadRow1Ref}>
                  <th className="sticky-col bg-white text-left px-3 py-2 border-b border-r border-[var(--border-c)] font-bold text-gray-400 w-16 top-0" style={{position:"sticky", top:0, zIndex:6}}>DIA</th>
                  {visibleStores.map(s => {
                    const emps = empByStore(s.id);
                    if (emps.length === 0) return null;
                    const hasArrival = !!s.horaChegada;
                    return (
                      <th key={s.id} colSpan={emps.length + (hasArrival ? 1 : 0)} className="text-center px-2 py-2 border-b border-l border-[var(--border-c)] font-extrabold text-[11px] tracking-wide sticky top-0" style={{ color: s.cor, background: `color-mix(in srgb, ${s.cor||"#999"} 8%, #ffffff 100%)`, position:"sticky", top:0, zIndex:4 }}>
                        {s.nome.toUpperCase()}
                      </th>
                    );
                  })}
                </tr>
                <tr>
                  <th className="sticky-col bg-white border-b border-r border-[var(--border-c)]" style={{position:"sticky", top:gridHeadRow2Top, zIndex:6}}></th>
                  {visibleStores.map(s => {
                    const emps = empByStore(s.id);
                    if (emps.length === 0) return null;
                    const hasArrival = !!s.horaChegada;
                    return (
                      <React.Fragment key={s.id}>
                        {hasArrival && (
                          <th className="px-2 py-2 border-b border-l border-[var(--border-c)] text-center font-semibold whitespace-nowrap sticky bg-white" style={{position:"sticky", top:gridHeadRow2Top, zIndex:3, minWidth:"90px"}}>
                            <div className="text-[10px] leading-tight">HORA CHEGADA<br/>CAMIÃO</div>
                          </th>
                        )}
                        {emps.map(e => (
                          <th key={e.id} className="px-2 py-2 border-b border-l border-[var(--border-c)] text-center font-semibold whitespace-nowrap sticky bg-white" style={{position:"sticky", top:gridHeadRow2Top, zIndex:3}}>
                            <div className="text-[11px]">{e.nome}</div>
                            <div className="text-[9px] text-gray-400 font-normal">{e.turno}</div>
                          </th>
                        ))}
                      </React.Fragment>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {days.map(day => {
                  const dow = new Date(y, m, day).getDay();
                  const isWeekend = dow === 0 || dow === 6;
                  return (
                    <tr key={day} className="hover:bg-gray-50/60">
                      <td className={`sticky-col bg-white px-3 py-1.5 border-b border-r border-[var(--border-c)] font-bold ${isWeekend ? "text-red-500" : "text-gray-600"}`}>
                        {day} <span className="font-normal text-[10px]">{DIAS_SEMANA[dow]}</span>
                      </td>
                      {visibleStores.map(s => {
                        const emps = empByStore(s.id);
                        if (emps.length === 0) return null;
                        const hasArrival = !!s.horaChegada;
                        return (
                          <React.Fragment key={s.id}>
                            {hasArrival && (
                              <td className="border-b border-l border-[var(--border-c)] p-0.5 text-center">
                                <input
                                  key={`${mk}-${arrivalKey(s.id, day)}`}
                                  type="text"
                                  className="w-full h-7 min-w-[80px] rounded-md text-[11px] font-semibold text-center border border-transparent hover:border-[var(--border-c)] focus:border-[var(--accent)] focus:outline-none bg-transparent"
                                  placeholder="—"
                                  defaultValue={arrivals[arrivalKey(s.id, day)] || ""}
                                  onBlur={(ev) => {
                                    const v = ev.target.value.trim();
                                    if (v !== (arrivals[arrivalKey(s.id, day)] || "")) setArrival(s.id, day, v);
                                  }}
                                  onKeyDown={(ev) => { if (ev.key === "Enter") ev.target.blur(); }}
                                />
                              </td>
                            )}
                            {emps.map(e => {
                              const k = cellKey(e.id, day);
                              const isPoolStore = s.tipo === "backup_pool";
                              const val = effectiveValue(e, day); // aplica folga fixa também nas lojas pool
                              const isAuto = !schedule[k] && val === "Folga";
                              const meta = statusMeta(val);
                              // Nas lojas pool, o seletor de "para qual loja foi o backup" só aparece
                              // quando a célula não tem um status normal atribuído (Folga, Falta, Abandono, etc.)
                              // — senão mostra o status normal, tal como nas lojas comuns.
                              const isKnownStatus = !!val && STATUS_OPTIONS.some(o => o.value === val);
                              const renderAsPool = isPoolStore && !isKnownStatus;
                              const dimmed = fStatus && val !== fStatus && !renderAsPool;
                              const poolLabel = renderAsPool ? (storeById(val)?.nome || (val ? val : "—")) : null;
                              return (
                                <td key={k} className="border-b border-l border-[var(--border-c)] p-0.5 text-center" style={{ opacity: dimmed ? 0.25 : 1 }}>
                                  {renderAsPool ? (
                                    <button onClick={(ev)=>openCellMenu(ev, e.id, day, s)} className="w-full h-7 min-w-[80px] rounded-md text-[11px] font-semibold flex items-center justify-center gap-1 px-1.5 truncate" style={{ background: val ? "#eff6ff" : "#f3f4f6", color: val ? "#1d4ed8" : "#9ca3af" }}>
                                      <span className="truncate">{poolLabel}</span>
                                      <Icon path={ICONS.chevronDown} size={10} className="shrink-0" />
                                    </button>
                                  ) : (
                                    <button onClick={(ev)=>openCellMenu(ev, e.id, day, s)} className="w-full h-7 min-w-[52px] rounded-md text-[11px] font-bold flex items-center justify-center" style={{ background: meta.bg, color: meta.fg, boxShadow: isAuto ? "inset 0 0 0 1px #c4b5fd" : "none" }} title={isAuto ? "Folga fixa automática" : meta.blank ? meta.label : ""}>
                                      {meta.blank ? "" : meta.label}
                                    </button>
                                  )}
                                </td>
                              );
                            })}
                          </React.Fragment>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      <div className="flex flex-wrap gap-3 mt-4">
        {STATUS_OPTIONS.filter(s=>s.value).map(s => (
          <div key={s.value} className="flex items-center gap-1.5 text-xs text-gray-500">
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: s.dot }}></span>{s.label}
          </div>
        ))}
        <div className="flex items-center gap-1.5 text-xs text-gray-500">
          <span className="w-2.5 h-2.5 rounded-full ring-2 ring-violet-300" style={{ background: "#eef0f4" }}></span>Folga fixa (automática)
        </div>
      </div>

      {editingCell && (editingCell.isPool ? (
        <CellStoreMenu
          anchorRect={editingCell.rect}
          options={poolOptionsFor(editingCell.store)}
          value={schedule[editingCell.key] || ""}
          onClose={() => setEditingCell(null)}
          onSelect={(value) => setCell(editingCell.empId, editingCell.day, value)}
        />
      ) : (
        <CellStatusMenu
          anchorRect={editingCell.rect}
          value={effectiveValue(employees.find(e=>e.id===editingCell.empId) || {}, editingCell.day)}
          onClose={() => setEditingCell(null)}
          onSelect={(value) => setCell(editingCell.empId, editingCell.day, value)}
        />
      ))}
    </div>
  );
}

function StoresView({ stores, employees, clients }) {
  const [tab, setTab] = useState("lojas");
  const [modal, setModal] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [fCliente, setFCliente] = useState("");

  const save = async (data) => {
    if (data.id) await col("stores").doc(data.id).set(data, { merge: true });
    else await col("stores").add({ ...data, ordem: stores.length, criadoEm: Date.now() });
    logHistory(data.id ? "Editou" : "Criou", "Loja", data.nome, data.clienteId ? `Cliente: ${clientName(data.clienteId)}` : "");
    setModal(null);
  };
  const remove = async (id) => {
    const st = stores.find(s => s.id === id);
    await col("stores").doc(id).delete();
    if (st) logHistory("Eliminou", "Loja", st.nome, "");
    setDeleting(null);
  };
  const countFor = (storeId) => employees.filter(e => e.lojaId === storeId && e.estado !== "Desligado").length;
  const clientName = (id) => clients.find(c=>c.id===id)?.nome || "";
  const clientColor = (id) => clients.find(c=>c.id===id)?.cor || "#9ca3af";
  const storesSorted = useMemo(() => [...stores].sort((a,b)=> (a.ordem??0)-(b.ordem??0) || a.nome.localeCompare(b.nome)), [stores]);
  const visibleStores = storesSorted.filter(s => !fCliente || s.clienteId === fCliente);

  const moveStore = async (storeId, dir) => {
    const idx = storesSorted.findIndex(s => s.id === storeId);
    const swapIdx = idx + dir;
    if (idx === -1 || swapIdx < 0 || swapIdx >= storesSorted.length) return;
    const list = [...storesSorted];
    [list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];
    // Reatribui ordens sequenciais (0,1,2...) para toda a lista, garantindo consistência
    await Promise.all(list.map((s, i) => col("stores").doc(s.id).set({ ordem: i }, { merge: true })));
    logHistory("Editou", "Loja", list[idx].nome, `Reordenou a sequência na Grelha (posição ${idx+1})`);
  };

  return (
    <div className="p-8 fade-in">
      <div className="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-extrabold">Gestão de Lojas &amp; Clientes</h1>
          <p className="text-sm text-gray-400">{stores.length} lojas · {clients.length} clientes configurados{fCliente ? " · remove o filtro de cliente para reordenar" : " · usa as setas para reordenar a sequência na Grelha"}</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
            {[["lojas","Lojas"],["clientes","Clientes"]].map(([k,l]) => (
              <button key={k} onClick={()=>setTab(k)} className={`px-4 py-1.5 rounded-md text-sm font-semibold ${tab===k ? "bg-white shadow text-[var(--text-primary)]" : "text-gray-500"}`}>{l}</button>
            ))}
          </div>
          {tab === "lojas" && (
            <select value={fCliente} onChange={e=>setFCliente(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">

function BackupModal({ backup, employees, onClose, onSave }) {
  // Colaborador do backup é texto livre -- não depende dos colaboradores cadastrados
  // no sistema. Se o registo for antigo (guardado com colaboradorId), pré-preenche
  // o campo com o nome correspondente para o utilizador poder editar à vontade.
  const nomeInicial = backup?.colaboradorNome || employees.find(e => e.id === backup?.colaboradorId)?.nome || "";
  const [form, setForm] = useState(backup ? { ...backup, colaboradorNome: nomeInicial } : { data: new Date().toISOString().slice(0,10), colaboradorNome: "", tipo: "Interno", origem: "", destino: "", duracao: 4, custo: 30, motivo: "Falta do driver residente" });
  const set = (k,v) => setForm(prev=>({...prev,[k]:v}));

  const submit = (e) => {
    e.preventDefault();
    const { colaboradorId, ...rest } = form; // deixa de gravar colaboradorId em novos registos
    onSave({ ...rest, colaboradorNome: form.colaboradorNome.trim() });
  };
  return (
    <Modal title={backup ? "Editar Backup" : "Registar Backup"} onClose={onClose}>
      <form onSubmit={submit}>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Data"><input type="date" required className={inputCls} value={form.data} onChange={e=>set("data", e.target.value)} /></Field>
          <Field label="Tipo">
            <select className={inputCls} value={form.tipo} onChange={e=>set("tipo", e.target.value)}>
              <option value="Interno">Interno</option><option value="Externo">Externo</option>
            </select>
          </Field>
        </div>
        <Field label="Colaborador">
          <input
            className={inputCls}
            value={form.colaboradorNome}
            onChange={e=>set("colaboradorNome", e.target.value)}
            placeholder="Escreve o nome do colaborador"
            autoComplete="off"
            required
          />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Origem"><input className={inputCls} value={form.origem} onChange={e=>set("origem", e.target.value)} /></Field>
          <Field label="Destino"><input className={inputCls} value={form.destino} onChange={e=>set("destino", e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Duração (h)"><input type="number" min="0" className={inputCls} value={form.duracao} onChange={e=>set("duracao", Number(e.target.value))} /></Field>
          <Field label="Custo (€)"><input type="number" min="0" className={inputCls} value={form.custo} onChange={e=>set("custo", Number(e.target.value))} /></Field>
        </div>
        <Field label="Motivo"><input className={inputCls} value={form.motivo} onChange={e=>set("motivo", e.target.value)} /></Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-100">Cancelar</button>
          <button type="submit" className="px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: "var(--accent)" }}>Guardar</button>
        </div>
      </form>
    </Modal>
  );
}

function BackupsView({ employees, monthOptions }) {
  const [backups, setBackups] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [fMonth, setFMonth] = useState(""); // "" = todos os meses

  useEffect(() => {
    setLoading(true);
    let query = col("backups").orderBy("data", "desc");
    if (fMonth) {
      const [y, m] = fMonth.split("-").map(Number);
      const from = `${fMonth}-01`;
      const to = `${monthKey(m === 12 ? y + 1 : y, m === 12 ? 0 : m)}-01`;
      // Range de datas -> lê apenas os registos do mês selecionado (poupa dados/leituras)
      query = col("backups").where("data", ">=", from).where("data", "<", to).orderBy("data", "desc");
    } else {
      query = query.limit(200);
    }
    const unsub = query.onSnapshot((snap) => {
      setBackups(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return () => unsub();
  }, [fMonth]);

  // Nome do colaborador do backup: texto livre (colaboradorNome). Para registos
  // antigos, guardados antes desta alteração, cai para o colaborador cadastrado
  // (colaboradorId) só para não perder o histórico já existente.
  const backupColabNome = (b) => b.colaboradorNome || employees.find(e=>e.id===b.colaboradorId)?.nome || "—";
  const internos = backups.filter(b=>b.tipo==="Interno").length;
  const externos = backups.filter(b=>b.tipo==="Externo").length;
  const custoTotal = backups.reduce((s,b)=>s+(Number(b.custo)||0),0);

  const save = async (data) => {
    if (data.id) await col("backups").doc(data.id).set(data, { merge:true });
    else await col("backups").add({ ...data, criadoEm: Date.now() });
    logHistory(data.id ? "Editou" : "Criou", "Backup", backupColabNome(data), `${data.tipo} · ${data.origem} → ${data.destino} · ${fmtEUR(data.custo)}`);
    setModal(null);
  };

  return (
    <div className="p-8 fade-in">
      <div className="flex items-start justify-between mb-5">
        <div>
          <h1 className="text-2xl font-extrabold">Gestão de Backups</h1>
          <p className="text-sm text-gray-400">{backups.length} registos de backup{fMonth ? " · filtrado por mês" : ""}</p>
        </div>
        <div className="flex items-center gap-2">
          <select value={fMonth} onChange={(e)=>setFMonth(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os meses</option>
            {monthOptions.map(mk => { const [yy,mm]=mk.split("-").map(Number); return <option key={mk} value={mk}>{MESES[mm-1]} {yy}</option>; })}
          </select>
          <button onClick={()=>setModal({mode:"new"})} className="flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: "var(--accent)" }}>
            <Icon path={ICONS.plus} size={16} /> Registar Backup
          </button>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-4 mb-5">
        <div className="bg-white rounded-2xl border border-[var(--border-c)] p-6 text-center">
          <div className="text-3xl font-extrabold" style={{color:"#14b8a6"}}>{internos}</div>
          <div className="text-xs font-bold text-gray-400 mt-1">INTERNOS</div>
        </div>
        <div className="bg-white rounded-2xl border border-[var(--border-c)] p-6 text-center">
          <div className="text-3xl font-extrabold" style={{color:"#f59e0b"}}>{externos}</div>
          <div className="text-xs font-bold text-gray-400 mt-1">EXTERNOS</div>
        </div>
        <div className="bg-white rounded-2xl border border-[var(--border-c)] p-6 text-center">
          <div className="text-3xl font-extrabold">{fmtEUR(custoTotal)}</div>
          <div className="text-xs font-bold text-gray-400 mt-1">CUSTO TOTAL</div>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-[var(--border-c)] overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-gray-400 text-xs font-bold border-b border-[var(--border-c)]">
              <th className="px-5 py-3">Data</th><th className="px-5 py-3">Colaborador</th><th className="px-5 py-3">Tipo</th>
              <th className="px-5 py-3">Origem → Destino</th><th className="px-5 py-3">Duração</th><th className="px-5 py-3">Custo</th>
              <th className="px-5 py-3">Motivo</th><th className="px-5 py-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            {loading ? <tr><td colSpan={8} className="text-center text-gray-300 py-10 text-sm">A carregar…</td></tr> :
              backups.map(b => (
                <tr key={b.id} className="border-b border-[var(--border-c)] last:border-0 hover:bg-gray-50/60">
                  <td className="px-5 py-3">{b.data?.split("-").reverse().join("/")}</td>
                  <td className="px-5 py-3 font-semibold">{backupColabNome(b)}</td>
                  <td className="px-5 py-3">
                    <span className={`px-2 py-0.5 rounded-md text-xs font-semibold ${b.tipo==="Interno" ? "bg-teal-50 text-teal-600" : "bg-amber-50 text-amber-600"}`}>{b.tipo}</span>
                  </td>
                  <td className="px-5 py-3 text-gray-500">{b.origem} → {b.destino}</td>
                  <td className="px-5 py-3 text-gray-500">{b.duracao}h</td>
                  <td className="px-5 py-3 font-semibold">{fmtEUR(b.custo)}</td>
                  <td className="px-5 py-3 text-gray-400">{b.motivo}</td>
                  <td className="px-5 py-3 text-right">
                    <button onClick={()=>setModal({mode:"edit", data:b})} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-500"><Icon path={ICONS.edit} size={15} /></button>
                  </td>
                </tr>
              ))}
            {!loading && backups.length===0 && <tr><td colSpan={8} className="text-center text-gray-400 py-10 text-sm">Sem registos de backup.</td></tr>}
          </tbody>
        </table>
      </div>

      {modal && <BackupModal backup={modal.data} employees={employees} onClose={()=>setModal(null)} onSave={save} />}
    </div>
  );
}

const ENTIDADE_META = {
  Colaborador: { icon: ICONS.users, color: "#4f6ef7" },
  Loja:        { icon: ICONS.store, color: "#8b5cf6" },
  Cliente:     { icon: ICONS.swap,  color: "#ec4899" },
  Backup:      { icon: ICONS.backup,color: "#14b8a6" },
  Grelha:      { icon: ICONS.grid,  color: "#f59e0b" },
};
const ACAO_META = {
  Criou:     { label: "Criou",     bg: "#e6f9f0", fg: "#10b981" },
  Editou:    { label: "Editou",    bg: "#eef1ff", fg: "#4f6ef7" },
  Eliminou:  { label: "Eliminou",  bg: "#fef2f2", fg: "#ef4444" },
};

function fmtDateTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit", year: "numeric" }) + " · " +
         d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
}

function HistoryView() {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fEntidade, setFEntidade] = useState("");

  useEffect(() => {
    setLoading(true);
    // Últimos 300 registos -> evita carregar todo o histórico de uma vez (poupa dados)
    const unsub = col("auditLog").orderBy("timestamp", "desc").limit(300).onSnapshot((snap) => {
      setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return () => unsub();
  }, []);

  const filtered = logs.filter(l => !fEntidade || l.entidade === fEntidade);

  return (
    <div className="p-8 fade-in">
      <div className="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-extrabold">Histórico de Edição</h1>
          <p className="text-sm text-gray-400">Registo de todas as alterações feitas na aplicação · últimos {logs.length} eventos</p>
        </div>
        <select value={fEntidade} onChange={e=>setFEntidade(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
          <option value="">Todas as áreas</option>
          {Object.keys(ENTIDADE_META).map(k => <option key={k} value={k}>{k}</option>)}
        </select>
      </div>

      <div className="bg-white rounded-2xl border border-[var(--border-c)] overflow-hidden">
        {loading ? (
          <div className="p-16 text-center text-gray-300 text-sm">A carregar histórico…</div>
        ) : filtered.length === 0 ? (
          <div className="p-16 text-center text-gray-400 text-sm">Sem registos {fEntidade ? `de ${fEntidade}` : ""} ainda.</div>
        ) : (
          <div className="divide-y divide-[var(--border-c)]">
            {filtered.map(l => {
              const em = ENTIDADE_META[l.entidade] || ENTIDADE_META.Grelha;
              const am = ACAO_META[l.acao] || ACAO_META.Editou;
              return (
                <div key={l.id} className="flex items-start gap-3 px-5 py-3.5 hover:bg-gray-50/60">
                  <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 mt-0.5" style={{ background: em.color+"18", color: em.color }}>
                    <Icon path={em.icon} size={15} />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="px-1.5 py-0.5 rounded text-[10px] font-bold" style={{ background: am.bg, color: am.fg }}>{am.label}</span>
                      <span className="text-xs font-semibold text-gray-400">{l.entidade}</span>
                      <span className="text-sm font-bold truncate">{l.alvo}</span>
                    </div>
                    {l.detalhes && <div className="text-xs text-gray-500 mt-0.5 truncate">{l.detalhes}</div>}
                  </div>
                  <div className="text-right shrink-0">
                    <div className="text-xs font-semibold text-gray-500">{l.user}</div>
                    <div className="text-[10px] text-gray-400">{fmtDateTime(l.timestamp)}</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}
