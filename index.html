function App() {
  const [user, setUser] = useState(() => {
    try {
      const raw = localStorage.getItem("opsUser");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  });
  const [view, setView] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [stores, setStores] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [clients, setClients] = useState([]);
  const [refsLoaded, setRefsLoaded] = useState({ s: false, e: false, c: false });
  const refsReady = refsLoaded.s && refsLoaded.e && refsLoaded.c;
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem("opsTheme") === "dark"; } catch (e) { return false; }
  });
  const scheduleCache = useRef({});
  const arrivalsCache = useRef({});

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
    try { localStorage.setItem("opsTheme", dark ? "dark" : "light"); } catch (e) {}
  }, [dark]);
  const toggleDark = useCallback(() => setDark(d => !d), []);

  const handleLogin = useCallback((name) => {
    const u = { displayName: name };
    try { localStorage.setItem("opsUser", JSON.stringify(u)); } catch (e) {}
    setUser(u);
  }, []);

  const handleLogout = useCallback(() => {
    try { localStorage.removeItem("opsUser"); } catch (e) {}
    setUser(null);
  }, []);

  // Coleções pequenas (lojas / colaboradores): listener único, dados leves -> mantido sempre ativo
  useEffect(() => {
    if (!user) return;
    const mark = (k) => setRefsLoaded(p => (p[k] ? p : { ...p, [k]: true }));
    const unsub1 = col("stores").orderBy("ordem", "asc").onSnapshot(
      (snap) => { setStores(snap.docs.map(d => ({ id: d.id, ...d.data() }))); mark("s"); },
      () => col("stores").onSnapshot((snap) => { setStores(snap.docs.map(d => ({ id: d.id, ...d.data() }))); mark("s"); })
    );
    const unsub2 = col("employees").onSnapshot((snap) => { setEmployees(snap.docs.map(d => ({ id: d.id, ...d.data() }))); mark("e"); });
    const unsub3 = col("clients").onSnapshot((snap) => { setClients(snap.docs.map(d => ({ id: d.id, ...d.data() }))); mark("c"); });
    return () => { unsub1(); unsub2(); unsub3(); };
  }, [user]);

  // Grelha: 1 único documento Firestore por mês (em vez de 1 doc por dia/colaborador) -> minimiza leituras/custos de dados.
  // Resultado é colocado em cache local (scheduleCache) para não voltar a pedir o mesmo mês ao Firestore.
  const getScheduleForMonth = useCallback(async (mk) => {
    if (scheduleCache.current[mk]) return scheduleCache.current[mk];
    const snap = await col("schedule").doc(mk).get({ source: "default" });
    const data = snap.exists ? (snap.data().cells || {}) : {};
    scheduleCache.current[mk] = data;
    return data;
  }, []);

  const saveCellStatus = useCallback(async (mk, empId, day, value) => {
    const ref = col("schedule").doc(mk);
    await ref.set({ cells: { [cellKey(empId, day)]: value } }, { merge: true });
    if (scheduleCache.current[mk]) scheduleCache.current[mk][cellKey(empId, day)] = value;
  }, []);

  // Hora de chegada do camião: guardada no mesmo documento mensal ("schedule/{mk}"),
  // num campo separado "arrivals" (chave por loja+dia) -> não interfere na grelha de status.
  const getArrivalsForMonth = useCallback(async (mk) => {
    if (arrivalsCache.current[mk]) return arrivalsCache.current[mk];
    const snap = await col("schedule").doc(mk).get({ source: "default" });
    const data = snap.exists ? (snap.data().arrivals || {}) : {};
    arrivalsCache.current[mk] = data;
    return data;
  }, []);

  const saveArrivalTime = useCallback(async (mk, storeId, day, value) => {
    const ref = col("schedule").doc(mk);
    const key = arrivalKey(storeId, day);
    await ref.set({ arrivals: { [key]: value } }, { merge: true });
    if (arrivalsCache.current[mk]) arrivalsCache.current[mk][key] = value;
  }, []);

  const monthOptions = useMemo(() => {
    const now = new Date();
    const arr = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      arr.push(monthKey(d.getFullYear(), d.getMonth()));
    }
    return arr;
  }, []);

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  return (
    <div className="flex min-h-screen">
      <Sidebar view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed} user={user} onLogout={handleLogout} />
      <div className="flex-1 min-w-0">
        <Header user={user} dark={dark} onToggleDark={toggleDark} />
        {view === "dashboard" && <DashboardView stores={stores} employees={employees} clients={clients} getScheduleForMonth={getScheduleForMonth} monthOptions={monthOptions} refsReady={refsReady} />}
        {view === "analyses" && <AnalysesView stores={stores} employees={employees} clients={clients} getScheduleForMonth={getScheduleForMonth} monthOptions={monthOptions} refsReady={refsReady} />}
        {view === "grid" && <GridView stores={stores} employees={employees} clients={clients} getScheduleForMonth={getScheduleForMonth} saveCellStatus={saveCellStatus} getArrivalsForMonth={getArrivalsForMonth} saveArrivalTime={saveArrivalTime} />}
        {view === "employees" && <EmployeesView employees={employees} stores={stores} />}
        {view === "stores" && <StoresView stores={stores} employees={employees} clients={clients} />}
        {view === "backups" && <BackupsView employees={employees} monthOptions={monthOptions} />}
        {view === "history" && <HistoryView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>

<script>
  // Compila o JSX manualmente (evita o conflito de runtime do Babel Standalone
  // quando corre a partir de um <script type="text/babel"> inline em alguns navegadores).
  function showBootError(err) {
    const root = document.getElementById("root");
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#161d2e;padding:24px;font-family:Inter,system-ui,sans-serif;">' +
        '<div style="background:#fff;border-radius:16px;padding:32px;max-width:560px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.3);">' +
          '<h2 style="margin:0 0 12px;color:#e0293b;font-size:18px;">Não foi possível iniciar a aplicação</h2>' +
          '<p style="margin:0 0 12px;color:#6b7280;font-size:13px;">Provável causa: falha ao carregar um script externo (Tailwind, Chart.js, Firebase, React ou Babel) ou erro de sintaxe no código. Verifica a ligação à internet e a consola do browser (F12) para o detalhe abaixo.</p>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;background:#f4f6fa;padding:12px;border-radius:8px;font-size:12px;color:#161d2e;max-height:260px;overflow:auto;">' +
            String((err && (err.stack || err.message)) || err).replace(/</g, "&lt;") +
          '</pre>' +
        '</div>' +
      '</div>';
    console.error("Erro ao compilar/iniciar a aplicação:", err);
  }

  (function () {
    try {
      if (typeof Babel === "undefined") {
        throw new Error("Babel não carregou (verifica a ligação à internet / bloqueadores de script).");
      }
      const el = document.getElementById("app-source");
      if (!el) {
        throw new Error("Bloco de código da aplicação (#app-source) não encontrado no HTML.");
      }
      const src = el.textContent;
      const out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
        sourceType: "script",
      }).code;
      const tag = document.createElement("script");
      tag.textContent = out;
      tag.onerror = function (e) { showBootError(e); };
      document.body.appendChild(tag);
    } catch (err) {
      showBootError(err);
    }
  })();
</script>
</body>
</html>
