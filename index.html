<script>
  // Carrega o Chart.js com CDNs de reserva. A referência ao <script> atual é guardada UMA vez
  // (document.currentScript é null dentro de callbacks assíncronos, o que fazia o fallback rebentar
  // e deixava os gráficos sempre "indisponíveis" quando o 1.º CDN falhava).
  window.__chartLoadFailed = false;
  (function () {
    var anchor = document.currentScript;
    function loadChart(urls) {
      if (!urls.length) { window.__chartLoadFailed = true; return; }
      var s = document.createElement("script");
      s.src = urls[0];
      s.onerror = function () { s.remove(); loadChart(urls.slice(1)); };
      anchor.parentNode.insertBefore(s, anchor.nextSibling);
    }
    loadChart([
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js",
      "https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js"
    ]);
  })();
</script>

/* ErrorBoundary — evita tela branca: se qualquer parte da app rebentar,  */
/* mostra o erro em vez de desmontar tudo em silêncio.                    */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Erro capturado pelo ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#161d2e",padding:"24px",fontFamily:"Inter,system-ui,sans-serif"}}>
          <div style={{background:"#fff",borderRadius:"16px",padding:"32px",maxWidth:"560px",width:"100%",boxShadow:"0 20px 40px rgba(0,0,0,.3)"}}>
            <h2 style={{margin:"0 0 12px",color:"#e0293b",fontSize:"18px"}}>Ocorreu um erro ao carregar a aplicação</h2>
            <p style={{margin:"0 0 12px",color:"#6b7280",fontSize:"13px"}}>Isto evita a tela branca — o detalhe técnico abaixo ajuda a corrigir a causa.</p>
            <pre style={{whiteSpace:"pre-wrap",wordBreak:"break-word",background:"#f4f6fa",padding:"12px",borderRadius:"8px",fontSize:"12px",color:"#161d2e",maxHeight:"260px",overflow:"auto"}}>{String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}</pre>
            <button onClick={() => window.location.reload()} style={{marginTop:"16px",background:"#4f6ef7",color:"#fff",border:"none",borderRadius:"8px",padding:"10px 16px",fontSize:"13px",fontWeight:600,cursor:"pointer"}}>Recarregar</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const col = (name) => db.collection(name);

// Histórico de edição — regista cada ação relevante feita na app (auditLog).
// Nunca bloqueia a ação principal: falhas de escrita no log são silenciosas.
async function logHistory(acao, entidade, alvo, detalhes) {
  let userName = "Utilizador";
  try {
    const raw = localStorage.getItem("opsUser");
    if (raw) userName = JSON.parse(raw).displayName || userName;
  } catch (e) {}
  try {
    await col("auditLog").add({
      timestamp: Date.now(),
      user: userName,
      acao,        // "Criou" | "Editou" | "Eliminou"
      entidade,     // "Colaborador" | "Loja" | "Cliente" | "Backup" | "Grelha"
      alvo: alvo || "",
      detalhes: detalhes || "",
    });
  } catch (e) {}
}

function LoginScreen({ onLogin }) {
  const [name, setName] = useState("");
  const [err, setErr] = useState("");
  const submit = (e) => {
    e.preventDefault();
    const trimmed = name.trim();
    if (!trimmed) { setErr("Introduz o teu nome para continuar."); return; }
    onLogin(trimmed);
  };
  return (
    <div className="min-h-screen flex items-center justify-center" style={{ background: "linear-gradient(135deg,#161d2e,#232e4a)" }}>
      <div className="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-sm text-center fade-in">
        <div className="w-14 h-14 rounded-xl mx-auto mb-4 flex items-center justify-center" style={{ background: "var(--accent)" }}>
          <Icon path={ICONS.grid} size={26} className="text-white" />
        </div>
        <h1 className="text-xl font-extrabold mb-1">OPS Control</h1>
        <p className="text-sm text-gray-500 mb-8">Gestão Operacional</p>
        <form onSubmit={submit} className="text-left">
          <label className="text-xs font-bold text-gray-400 mb-1.5 block">O TEU NOME</label>
          <input
            autoFocus
            value={name}
            onChange={(e) => { setName(e.target.value); if (err) setErr(""); }}
            placeholder="Ex: Ana Silva"
            className="w-full border border-[var(--border-c)] rounded-lg py-2.5 px-3 text-sm mb-4 outline-none focus:border-[var(--accent)]"
          />
          <button type="submit" className="w-full flex items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-semibold text-white hover:opacity-90" style={{ background: "var(--accent)" }}>
            Entrar
          </button>
        </form>
        {err && <p className="text-xs text-red-500 mt-3">{err}</p>}

/* ---------------------------------------------------------------------- */
/* Chart wrapper (Chart.js)                                               */
/* ---------------------------------------------------------------------- */
function ChartCanvas({ type, data, options, height = 240 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [ready, setReady] = useState(typeof window.Chart !== "undefined");
  const [failed, setFailed] = useState(false);
  const [errMsg, setErrMsg] = useState("");

  // Se o Chart.js ainda não carregou (script externo lento/bloqueado),
  // aguarda em vez de rebentar com "Chart is not defined".
  useEffect(() => {
    if (ready) return;
    let tries = 0;
    const id = setInterval(() => {
      tries++;
      if (typeof window.Chart !== "undefined") {
        setReady(true);
        clearInterval(id);
      } else if (window.__chartLoadFailed || tries > 100) { // ~10s
        setFailed(true);
        clearInterval(id);
      }
    }, 100);
    return () => clearInterval(id);
  }, [ready]);

  useEffect(() => {
    if (!ready || !canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    try {
      chartRef.current = new Chart(canvasRef.current.getContext("2d"), { type, data, options });
    } catch (e) {
      console.error("Erro ao desenhar gráfico:", e);
      setErrMsg(String((e && e.message) || e));
      setFailed(true);
    }
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [ready, JSON.stringify(data), type]);
  useEffect(() => { if (failed && errMsg) { setFailed(false); setErrMsg(""); } }, [JSON.stringify(data)]);

  if (failed) {
    return (
      <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", color: "#9ca3af", fontSize: 12, textAlign: "center", padding: 12 }}>
        {errMsg ? `Erro ao desenhar o gráfico: ${errMsg}` : "Gráfico indisponível (falha ao carregar Chart.js — verifica a ligação à internet ou bloqueadores de scripts)"}
      </div>
    );
  }
  return <div style={{ height }}><canvas ref={canvasRef}></canvas></div>;
}

/* ---------------------------------------------------------------------- */
/* CAMADA ANALÍTICA PARTILHADA (Dashboard + Análises)                     */
/* Lê apenas dados já existentes: schedule/{YYYY-MM}.cells (grelha),      */
/* stores, employees, clients e backups (intervalo de datas).             */
/* Relações reais: colaborador.lojaId -> loja.clienteId -> cliente.       */
/* ---------------------------------------------------------------------- */
const ABS_TYPES = ["Falta", "Meia Falta", "Abandono"];
const TYPE_COLORS = { "Falta": "#ef4444", "Meia Falta": "#f59e0b", "Abandono": "#7f1d1d", "Backup Interno": "#0d9488", "Backup Externo": "#d97706", "Pool": "#0d9488" };
const COB_LABEL = { int: "Backup interno", ext: "Backup externo", sem: "Sem backup" };
const COB_COLOR = { int: "#0d9488", ext: "#f59e0b", sem: "#ef4444" };

const normTxt = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const shiftMonth = (mk, delta) => { const [y, m] = mk.split("-").map(Number); const d = new Date(y, m - 1 + delta, 1); return monthKey(d.getFullYear(), d.getMonth()); };
const monthWindow = (endMk, n) => Array.from({ length: n }, (_, i) => shiftMonth(endMk, i - (n - 1)));
const monthLabelOf = (mk) => { const [y, m] = mk.split("-").map(Number); return `${MESES[m - 1]} ${y}`; };
const monthShort = (mk) => { const [y, m] = mk.split("-").map(Number); return `${MESES[m - 1].slice(0, 3)}/${String(y).slice(2)}`; };
const isoDate = (y, m0, d) => `${y}-${pad2(m0 + 1)}-${pad2(d)}`;
const dateKey = (dt) => isoDate(dt.getFullYear(), dt.getMonth(), dt.getDate());
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDM = (dt) => `${pad2(dt.getDate())}/${pad2(dt.getMonth() + 1)}`;
const fmtDMY = (s) => { const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const weekStartOf = (y, m0, d) => { const dt = new Date(y, m0, d); dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); return dt; };
const addDays = (dt, n) => { const r = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n); return r; };
// Semana = segunda a domingo. wk = data (ISO) da segunda-feira.
const weekRangeLabel = (wk) => { const s = parseISO(wk); return `${fmtDM(s)}–${fmtDM(addDays(s, 6))}`; };

// Semanas de um mês (recortadas ao mês): [{wk, idx, from, to, label}]
function weeksOfMonth(mk) {
  const [y, mo] = mk.split("-").map(Number);
  const m0 = mo - 1;
  const nd = daysInMonth(y, m0);
  const list = [];
  for (let d = 1; d <= nd; d++) {
    const k = dateKey(weekStartOf(y, m0, d));
    let w = list[list.length - 1];
    if (!w || w.wk !== k) { w = { wk: k, idx: list.length + 1, from: d, to: d }; list.push(w); }
    w.to = d;
  }
  list.forEach((w) => { w.label = `S${w.idx} · ${pad2(w.from)}–${pad2(w.to)}/${pad2(mo)}`; });
  return list;
}

// Contadores por estado (cada estado é contado individualmente)
const emptyCounts = () => ({ ok: 0, falta: 0, meia: 0, abandono: 0, baixa: 0, formacao: 0, bkpInt: 0, bkpExt: 0, folga: 0, bloq: 0, pool: 0, cInt: 0, cExt: 0, sem: 0 });
function addRec(c, r) {
  switch (r.st) {
    case "OK": c.ok++; break;
    case "Falta": c.falta++; break;
    case "Meia Falta": c.meia++; break;
    case "Abandono": c.abandono++; break;
    case "Baixa": c.baixa++; break;
    case "Formação": c.formacao++; break;
    case "Backup Interno": c.bkpInt++; c.cInt++; break;
    case "Backup Externo": c.bkpExt++; c.cExt++; break;
    case "Folga": c.folga++; break;
    case "Bloqueado": c.bloq++; break;
    case "Pool": c.pool++; c.cInt++; break;
    default: break;
  }
  if (r.cob === "sem") c.sem++;
}
const totalFaltas = (c) => c.falta + c.meia + c.abandono;
const totalBkpInt = (c) => c.bkpInt + c.pool; // status "Backup Interno" + atribuições da loja pool
const outrosEstados = (c) => c.formacao + c.folga + c.bloq;
const presencaPct = (c) => {
  const base = c.ok + c.falta + c.meia + c.abandono + c.bkpInt + c.bkpExt + c.pool;
  return base > 0 ? Math.round((c.ok / base) * 1000) / 10 : null;
};
const countRecs = (recs) => { const c = emptyCounts(); recs.forEach((r) => addRec(c, r)); return c; };

// Constrói um registo por célula preenchida da grelha.
// Células de lojas "pool" guardam o ID da loja coberta (não um estado) -> st = "Pool".
function buildRecords(schedules, employees, stores, clients) {
  const empById = new Map(employees.map((e) => [e.id, e]));
  const storeById = new Map(stores.map((s) => [s.id, s]));
  const clientById = new Map(clients.map((c) => [c.id, c]));
  const out = [];
  Object.keys(schedules).forEach((mk) => {
    const cells = schedules[mk] || {};
    const [y, mo] = mk.split("-").map(Number);
    const m0 = mo - 1;
    const nd = daysInMonth(y, m0);
    Object.keys(cells).forEach((key) => {
      const val = cells[key];
      if (!val) return;
      const i = key.lastIndexOf("_");
      if (i < 0) return;
      const empId = key.slice(0, i);
      const day = Number(key.slice(i + 1));
      if (!day || day > nd) return;
      let st = null, target = "";
      if (STATUS_VALUE_SET.has(val)) st = val;
      else if (storeById.has(val)) { st = "Pool"; target = val; }
      if (!st) return;
      const emp = empById.get(empId);
      const ownStore = emp ? storeById.get(emp.lojaId) : null;
      // Backup interno da loja pool: conta para a loja/cliente COBERTOS (ID guardado na célula).
      // Restantes estados (incl. "Backup Interno"/"Backup Externo"): loja/cliente do colaborador na grelha.
      const store = st === "Pool" ? storeById.get(target) : ownStore;
      const client = store ? clientById.get(store.clienteId) : null;
      const dt = new Date(y, m0, day);
      out.push({
        mk, day, date: isoDate(y, m0, day), dow: dt.getDay(), wk: dateKey(weekStartOf(y, m0, day)),
        empId, emp: emp ? emp.nome : "Colaborador removido", origStore: ownStore ? ownStore.nome : "",
        storeId: store ? store.id : "", store: store ? store.nome : "Sem loja",
        clientId: client ? client.id : "", client: client ? client.nome : "Sem cliente", clientCor: client ? client.cor : "#9ca3af",
        st, target, cob: "",
      });
    });
  });
  return out;
}
const STATUS_VALUE_SET = new Set(STATUS_OPTIONS.map((s) => s.value).filter(Boolean));

// Liga registos da coleção "backups" (texto livre em destino) a lojas pelo nome (igualdade normalizada
// ou nome completo da loja contido no destino). O que não corresponder fica sem loja (_sid vazio).
function matchBackups(backups, stores) {
  const named = stores.map((s) => ({ id: s.id, n: normTxt(s.nome), cid: s.clienteId || "" })).filter((s) => s.n);
  return backups.map((b) => {
    const n = normTxt(b.destino);
    let hit = null;
    if (n) {
      hit = named.find((s) => s.n === n) ||
        named.filter((s) => s.n.length >= 3 && n.includes(s.n)).sort((a, b2) => b2.n.length - a.n.length)[0] || null;
    }
    return { ...b, _sid: hit ? hit.id : "", _cid: hit ? hit.cid : "" };
  });
}

// Cobertura das faltas — SÓ com a grelha. Cada célula "Backup Interno" / "Backup Externo" (e cada atribuição
// da loja pool, que conta como interno na loja coberta) conta como UMA falta com backup interno/externo.
// Para saber quais faltas ficam "sem backup", cada backup emparelha com UMA ausência da mesma loja
// (1.º no mesmo dia, depois na mesma semana, depois no mesmo mês) -> r.cob = "int" | "ext" | "sem".
// Nunca se conta o mesmo backup duas vezes.
function annotateCoverage(recs) {
  const byStore = new Map();
  recs.forEach((r) => {
    const t = r.st === "Backup Interno" || r.st === "Pool" ? "int" : r.st === "Backup Externo" ? "ext" : null;
    if (!t || !r.storeId) return;
    let l = byStore.get(r.storeId); if (!l) { l = []; byStore.set(r.storeId, l); }
    l.push({ t, date: r.date, wk: r.wk, mk: r.mk, used: false });
  });
  const order = { "Falta": 0, "Abandono": 1, "Meia Falta": 2 };
  recs.filter((r) => ABS_TYPES.includes(r.st)).sort((a, b) => order[a.st] - order[b.st] || a.date.localeCompare(b.date)).forEach((r) => {
    const list = byStore.get(r.storeId) || [];
    const pick = (fn) => list.find((x) => !x.used && fn(x) && x.t === "int") || list.find((x) => !x.used && fn(x));
    const hit = pick((x) => x.date === r.date) || pick((x) => x.wk === r.wk) || pick((x) => x.mk === r.mk);
    if (hit) { hit.used = true; r.cob = hit.t; } else r.cob = "sem";
  });
}

// Hook de dados: 1 leitura (em cache) por mês da grelha + 1 query por intervalo de datas em "backups".
function useOpsData({ months, stores, employees, clients, getScheduleForMonth, enabled }) {
  const monthsKey = months.join(",");
  const [raw, setRaw] = useState({ schedules: {}, backups: [] });
  const [status, setStatus] = useState("loading");
  const [error, setError] = useState("");
  const [tick, setTick] = useState(0);

  useEffect(() => {
    if (!enabled) return;
    let alive = true;
    setStatus("loading");
    setError("");
    const list = monthsKey.split(",").filter(Boolean);
    const from = `${list[0]}-01`;
    const to = `${shiftMonth(list[list.length - 1], 1)}-01`;
    Promise.all([
      Promise.all(list.map((mk) => getScheduleForMonth(mk))),
      col("backups").where("data", ">=", from).where("data", "<", to).get(),
    ]).then(([scheds, snap]) => {
      if (!alive) return;
      const schedules = {};
      list.forEach((mk, i) => { schedules[mk] = scheds[i] || {}; });
      setRaw({ schedules, backups: snap.docs.map((d) => ({ id: d.id, ...d.data() })) });
      setStatus("ready");
    }).catch((err) => {
      if (!alive) return;
      console.error("Erro a carregar dados analíticos:", err);
      setError(String((err && err.message) || err));
      setStatus("error");
    });
    return () => { alive = false; };
  }, [monthsKey, tick, enabled, getScheduleForMonth]);

  const built = useMemo(() => {
    const recs = buildRecords(raw.schedules, employees, stores, clients);
    const bks = matchBackups(raw.backups, stores);
    annotateCoverage(recs);
    const monthHasData = {};
    Object.keys(raw.schedules).forEach((mk) => { monthHasData[mk] = Object.keys(raw.schedules[mk] || {}).length > 0; });
    return { recs, bks, monthHasData };
  }, [raw, employees, stores, clients]);

  const reload = useCallback(() => setTick((t) => t + 1), []);
  return { status: enabled ? status : "loading", error, reload, recs: built.recs, bks: built.bks, monthHasData: built.monthHasData };
}

// Agrupa por cliente e, dentro de cada cliente, por loja
function groupByClientStore(recs) {
  const map = new Map();
  recs.forEach((r) => {
    const ck = r.clientId || "_none";
    let c = map.get(ck);
    if (!c) { c = { id: ck, nome: r.client, cor: r.clientCor, tot: emptyCounts(), stores: new Map() }; map.set(ck, c); }
    addRec(c.tot, r);
    const sk = r.storeId || "_none";
    let s = c.stores.get(sk);
    if (!s) { s = { id: sk, nome: r.store, tot: emptyCounts() }; c.stores.set(sk, s); }
    addRec(s.tot, r);
  });
  const cmp = (a, b) => totalFaltas(b.tot) - totalFaltas(a.tot) || a.nome.localeCompare(b.nome);
  return [...map.values()].map((c) => ({ ...c, stores: [...c.stores.values()].sort(cmp) })).sort(cmp);
}

function weekStats(mk, recs) {
  const map = new Map(weeksOfMonth(mk).map((w) => [w.wk, { ...w, c: emptyCounts() }]));
  recs.forEach((r) => { if (r.mk !== mk) return; const w = map.get(r.wk); if (w) addRec(w.c, r); });
  return [...map.values()];
}

              <td className="px-3 py-1.5 border-b border-[var(--border-c)]">{DIAS_SEMANA[r.dow]}</td>
              <td className="px-3 py-1.5 border-b border-[var(--border-c)] whitespace-nowrap">{weekRangeLabel(r.wk)}</td>
              <td className="px-3 py-1.5 border-b border-[var(--border-c)] font-semibold">{r.emp}</td>
              <td className="px-3 py-1.5 border-b border-[var(--border-c)]">{r.client}</td>
              <td className="px-3 py-1.5 border-b border-[var(--border-c)]">{r.store}</td>
              <td className="px-3 py-1.5 border-b border-[var(--border-c)]"><Pill color={TYPE_COLORS[r.st] || "#6b7280"}>{r.st === "Pool" ? "Backup Interno (pool)" : r.st}</Pill></td>
              <td className="px-3 py-1.5 border-b border-[var(--border-c)]">{r.cob ? <Pill color={COB_COLOR[r.cob]}>{COB_LABEL[r.cob]}</Pill> : "—"}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Painel "Faltas por Cliente" com detalhe por loja e todos os estados
function ClientFaltasTable({ groups }) {
  const [open, setOpen] = useState({});
  const maxF = Math.max(1, ...groups.map((g) => totalFaltas(g.tot)));
  const totals = useMemo(() => {
    const t = emptyCounts();
    groups.forEach((g) => Object.keys(t).forEach((k) => { t[k] += g.tot[k]; }));
    return t;
  }, [groups]);
  const STATE_ORDER = [["OK", "ok"], ["Falta", "falta"], ["Meia Falta", "meia"], ["Formação", "formacao"], ["Backup Interno", "bkpInt"], ["Backup Externo", "bkpExt"], ["Folga", "folga"], ["Baixa", "baixa"], ["Abandono", "abandono"], ["Bloqueado", "bloq"]];
  const num = (v, color) => <td className="px-3 py-2 border-b border-[var(--border-c)] text-center tabular-nums" style={v > 0 && color ? { color, fontWeight: 700 } : { color: v > 0 ? undefined : "#9ca3af" }}>{v}</td>;
  const row = (nome, c, opts) => (
    <>
      <td className="px-3 py-2 border-b border-[var(--border-c)]" style={{ paddingLeft: opts.indent ? 34 : 12 }}>
        <div className="flex items-center gap-2 min-w-0">
          {opts.toggle && <span className="text-gray-400 shrink-0" style={{ display: "inline-flex", transform: opts.isOpen ? "rotate(0deg)" : "rotate(-90deg)" }}><Icon path={ICONS.chevronDown} size={14} /></span>}
          {opts.cor && <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: opts.cor }}></span>}
          <span className={`truncate ${opts.indent ? "" : "font-bold"}`} title={nome}>{nome}</span>
        </div>
      </td>
      <td className="px-3 py-2 border-b border-[var(--border-c)]" style={{ minWidth: 110 }}>
        <div className="flex items-center gap-2">
          <span className="font-extrabold tabular-nums w-6 text-right">{totalFaltas(c)}</span>
          <div className="flex-1 h-1.5 rounded-full bg-gray-100 overflow-hidden"><div className="h-full rounded-full" style={{ width: `${(totalFaltas(c) / maxF) * 100}%`, background: "#ef4444" }}></div></div>
        </div>
      </td>
      {num(c.falta, "#ef4444")}{num(c.meia, "#f59e0b")}{num(c.abandono, "#b91c1c")}
      {num(c.cInt, "#0d9488")}{num(c.cExt, "#d97706")}{num(c.sem, "#ef4444")}
      {num(c.baixa, "#8b5cf6")}{num(outrosEstados(c))}
    </>
  );
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-xs min-w-[860px]">
        <thead>
          <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Cliente / Loja</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Total faltas</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]">Faltas</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]">Meias</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]">Abandonos</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]" title="Células Backup Interno na grelha (inclui atribuições da loja pool)">C/ Bkp Int.</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]" title="Células Backup Externo na grelha">C/ Bkp Ext.</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]" title="Faltas sem nenhum backup da grelha na mesma loja">Sem backup</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]">Baixas</th>
            <th className="px-3 py-2 border-b border-[var(--border-c)]" title="Formação, Folga e Bloqueado">Outros</th>
          </tr>
        </thead>
        <tbody>
          {groups.map((g) => {
            const isOpen = !!open[g.id];
            return (
              <React.Fragment key={g.id}>
                <tr className="cursor-pointer hover:bg-gray-50/60" onClick={() => setOpen((p) => ({ ...p, [g.id]: !p[g.id] }))}>
                  {row(g.nome, g.tot, { toggle: true, isOpen, cor: g.cor })}
                </tr>
                {isOpen && g.stores.map((s) => <tr key={g.id + s.id} className="bg-gray-50">{row(s.nome, s.tot, { indent: true })}</tr>)}
                {isOpen && (
                  <tr className="bg-gray-50">
                    <td colSpan={10} className="px-3 py-2 border-b border-[var(--border-c)]" style={{ paddingLeft: 34 }}>
                      <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-gray-500">
                        {STATE_ORDER.map(([label, k]) => (
                          <span key={k} className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: statusMeta(label).dot }}></span>{label}: <b className="text-[var(--text-primary)]">{g.tot[k]}</b></span>
                        ))}
                        {g.tot.pool > 0 && <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: "#3b82f6" }}></span>Backup interno via loja pool: <b className="text-[var(--text-primary)]">{g.tot.pool}</b></span>}
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            );
          })}
          <tr className="font-extrabold">
            {row("Total", totals, {})}
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* DASHBOARD                                                              */
/* ---------------------------------------------------------------------- */
function DashboardView({ stores, employees, clients, getScheduleForMonth, monthOptions, refsReady }) {
  const [tab, setTab] = useState("geral");
  const now = new Date();
  const [selMonth, setSelMonth] = useState(monthKey(now.getFullYear(), now.getMonth()));
  const [fCliente, setFCliente] = useState("");
  const [fLoja, setFLoja] = useState("");

  // Uma única janela de 6 meses (terminada no mês selecionado) alimenta as 3 abas -> mesma fonte, sem contagens divergentes
  const months = useMemo(() => monthWindow(selMonth, 6), [selMonth]);
  const data = useOpsData({ months, stores, employees, clients, getScheduleForMonth, enabled: refsReady });
  const loading = data.status === "loading";

  const storeOptions = useMemo(() => stores.filter((s) => !fCliente || s.clienteId === fCliente).sort((a, b) => a.nome.localeCompare(b.nome)), [stores, fCliente]);
  const recs = useMemo(() => data.recs.filter((r) => (!fCliente || r.clientId === fCliente) && (!fLoja || r.storeId === fLoja)), [data.recs, fCliente, fLoja]);
  const bks = useMemo(() => data.bks.filter((b) => (!fCliente || b._cid === fCliente) && (!fLoja || b._sid === fLoja)), [data.bks, fCliente, fLoja]);

  const monthRecs = useMemo(() => recs.filter((r) => r.mk === selMonth), [recs, selMonth]);
  const monthBks = useMemo(() => bks.filter((b) => (b.data || "").startsWith(selMonth)), [bks, selMonth]);
  const tot = useMemo(() => countRecs(monthRecs), [monthRecs]);
  const groups = useMemo(() => groupByClientStore(monthRecs), [monthRecs]);
  const weeks = useMemo(() => weekStats(selMonth, monthRecs), [selMonth, monthRecs]);
  const [y, m] = selMonth.split("-").map(Number);
  const monthLabel = `${MESES[m - 1]} ${y}`;
  const monthEmpty = !loading && data.status === "ready" && !data.monthHasData[selMonth];

  const extra = useMemo(() => {
    const porLoja = {}, porOp = {};
    monthRecs.forEach((r) => {
      if (!ABS_TYPES.includes(r.st)) return;
      porLoja[r.store] = (porLoja[r.store] || 0) + 1;
      porOp[r.emp] = (porOp[r.emp] || 0) + 1;
    });
    const l = Object.entries(porLoja).sort((a, b) => b[1] - a[1]);
    const o = Object.entries(porOp).sort((a, b) => b[1] - a[1]);
    return { lojaMax: l[0] || ["—", 0], lojaMin: l[l.length - 1] || ["—", 0], opMax: o[0] || ["—", 0] };
  }, [monthRecs]);

  const custoBackups = monthBks.reduce((s, b) => s + (Number(b.custo) || 0), 0);
  const regInt = monthBks.filter((b) => b.tipo !== "Externo").length;
  const regExt = monthBks.filter((b) => b.tipo === "Externo").length;

  const clienteChart = useMemo(() => ({
    labels: groups.map((g) => g.nome),
    datasets: [
      { label: "Falta", data: groups.map((g) => g.tot.falta), backgroundColor: "#ef4444" },
      { label: "Meia Falta", data: groups.map((g) => g.tot.meia), backgroundColor: "#f59e0b" },
      { label: "Abandono", data: groups.map((g) => g.tot.abandono), backgroundColor: "#7f1d1d" },
    ],
  }), [groups]);

  const coberturaChart = useMemo(() => ({
    labels: ["Backup interno", "Backup externo", "Sem backup"],
    datasets: [{ data: [tot.cInt, tot.cExt, tot.sem], backgroundColor: ["#0d9488", "#f59e0b", "#ef4444"], borderWidth: 0 }],
  }), [tot]);

  const faltasPorLojaChart = useMemo(() => {
    const map = new Map();
    monthRecs.forEach((r) => {
      let s = map.get(r.store); if (!s) { s = emptyCounts(); map.set(r.store, s); }
      addRec(s, r);
    });
    const rows = [...map.entries()].filter(([, c]) => totalFaltas(c) + c.baixa + totalBkpInt(c) + c.bkpExt > 0).sort((a, b) => totalFaltas(b[1]) - totalFaltas(a[1]));
    return {
      labels: rows.map(([n]) => n),
      datasets: [
        { label: "Falta", data: rows.map(([, c]) => c.falta), backgroundColor: "#ef4444" },
        { label: "Meia Falta", data: rows.map(([, c]) => c.meia), backgroundColor: "#f59e0b" },
        { label: "Abandono", data: rows.map(([, c]) => c.abandono), backgroundColor: "#7f1d1d" },
        { label: "Backup Int.", data: rows.map(([, c]) => totalBkpInt(c)), backgroundColor: "#14b8a6" },
        { label: "Backup Ext.", data: rows.map(([, c]) => c.bkpExt), backgroundColor: "#fbbf24" },
        { label: "Baixa", data: rows.map(([, c]) => c.baixa), backgroundColor: "#a855f7" },
      ],
    };
  }, [monthRecs]);

  const distribChart = useMemo(() => ({
    labels: ["OK", "Falta", "Meia Falta", "Formação", "Backup Int.", "Backup Ext.", "Folga", "Baixa", "Abandono", "Bloqueado"],
    datasets: [{
      data: [tot.ok, tot.falta, tot.meia, tot.formacao, totalBkpInt(tot), tot.bkpExt, tot.folga, tot.baixa, tot.abandono, tot.bloq],
      backgroundColor: ["#22c55e", "#ef4444", "#f97316", "#3b82f6", "#0d9488", "#f59e0b", "#9ca3af", "#a855f7", "#7f1d1d", "#d1d5db"],
      borderWidth: 0,
    }],
  }), [tot]);

  const weeklyStackChart = useMemo(() => ({
    labels: weeks.map((w) => w.label),
    datasets: [
      { label: "Falta", data: weeks.map((w) => w.c.falta), backgroundColor: "#ef4444" },
      { label: "Meia Falta", data: weeks.map((w) => w.c.meia), backgroundColor: "#f59e0b" },
      { label: "Abandono", data: weeks.map((w) => w.c.abandono), backgroundColor: "#7f1d1d" },
    ],
  }), [weeks]);

  const weeklyLineChart = useMemo(() => ({
    labels: weeks.map((w) => `S${w.idx}`),
    datasets: [{ label: "Faltas", data: weeks.map((w) => totalFaltas(w.c)), borderColor: "#4f6ef7", backgroundColor: "rgba(79,110,247,0.12)", fill: true, tension: 0.35, pointRadius: 3 }],
  }), [weeks]);

  const heatmap = useMemo(() => {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    monthRecs.forEach((r) => { if (ABS_TYPES.includes(r.st)) counts[r.dow]++; });
    return counts;
  }, [monthRecs]);
  const maxHeat = Math.max(1, ...heatmap);

  const onCliente = (v) => { setFCliente(v); setFLoja(""); };

  return (
    <div className="p-4 md:p-8 fade-in">
      <h1 className="text-2xl font-extrabold">Dashboard Operacional</h1>
      <p className="text-sm text-gray-400 mb-5">Análise completa de presenças, faltas e backups</p>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        <span className="text-xs font-bold text-gray-400 uppercase tracking-wide">Mês em análise:</span>
        <select value={selMonth} onChange={(e) => setSelMonth(e.target.value)} className={filterSelCls}>
          {monthOptions.map((mk) => <option key={mk} value={mk}>{monthLabelOf(mk)}</option>)}
        </select>
        <select value={fCliente} onChange={(e) => onCliente(e.target.value)} className={filterSelCls}>
          <option value="">Todos os Clientes</option>
          {clients.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
        <select value={fLoja} onChange={(e) => setFLoja(e.target.value)} className={filterSelCls}>
          <option value="">Todas as Lojas</option>
          {storeOptions.map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}
        </select>
      </div>

      <div className="flex gap-1 bg-gray-100 rounded-lg p-1 w-fit max-w-full overflow-x-auto mb-5">
        {[["geral", "Visão Geral"], ["mensal", "Comparativo Mensal"], ["semanal", "Análise Semanal"]].map(([k, l]) => (
          <button key={k} onClick={() => setTab(k)} className={`px-4 py-1.5 rounded-md text-sm font-semibold whitespace-nowrap ${tab === k ? "bg-white shadow text-[var(--text-primary)]" : "text-gray-500"}`}>{l}</button>
        ))}
      </div>

      {(loading || data.status === "error") && <StateBox status={data.status} error={data.error} onRetry={data.reload} />}
      {monthEmpty && tab !== "mensal" && <StateBox status="ready" empty emptyText={`Sem dados registados na grelha para ${monthLabel}.`} />}

      {!loading && data.status === "ready" && tab === "geral" && !monthEmpty && (
        <>
          <div className="grid grid-cols-2 sm:grid-cols-4 2xl:grid-cols-8 gap-3 mb-5">
            <MiniStat label="Total de faltas" value={totalFaltas(tot)} sub="Falta + Meia + Abandono" color="#ef4444" />
            <MiniStat label="Faltas c/ bkp interno" value={tot.cInt} sub="backup interno na grelha" color="#0d9488" />
            <MiniStat label="Faltas c/ bkp externo" value={tot.cExt} sub="backup externo na grelha" color="#d97706" />
            <MiniStat label="Faltas sem backup" value={tot.sem} sub="sem backup na grelha" color="#ef4444" />
            <MiniStat label="Meias faltas" value={tot.meia} sub={`${tot.falta} faltas completas`} color="#f59e0b" />
            <MiniStat label="Abandonos" value={tot.abandono} sub="no mês" color="#b91c1c" />
            <MiniStat label="Baixas" value={tot.baixa} sub="dias de baixa" color="#8b5cf6" />
            <MiniStat label="Outros estados" value={outrosEstados(tot)} sub="Formação, Folga, Bloq." />
          </div>

          <Card title={`Faltas por Cliente · ${monthLabel}`} className="mb-5" right={<span className="text-[11px] text-gray-400">Clique num cliente para ver o detalhe por loja</span>}>
            {groups.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">Sem registos para os filtros selecionados.</div> : <ClientFaltasTable groups={groups} />}
            <p className="text-[11px] text-gray-400 mt-3 leading-relaxed">
              Total de faltas = Falta + Meia Falta + Abandono. Cada célula da grelha marcada como Backup Interno (incluindo atribuições da loja pool, contadas na loja coberta) ou Backup Externo conta como uma falta com backup interno ou externo, respetivamente, na loja e cliente do colaborador. “Sem backup” = faltas que não conseguem ser emparelhadas com nenhum backup da mesma loja (mesmo dia, depois mesma semana, depois mesmo mês); cada backup emparelha com uma única falta.
            </p>
          </Card>

          <div className="grid lg:grid-cols-3 gap-5 mb-5">
            <Card title="Faltas por Cliente" className="lg:col-span-2">
              {groups.length === 0 ? <div className="h-[240px] flex items-center justify-center text-gray-300 text-sm">Sem dados</div> :
                <ChartCanvas type="bar" data={clienteChart} options={barStackOpts} />}
            </Card>
            <Card title="Cobertura das Faltas">
              {totalFaltas(tot) === 0 ? <div className="h-[240px] flex items-center justify-center text-gray-300 text-sm">Sem faltas no mês</div> :
                <ChartCanvas type="doughnut" data={coberturaChart} options={{ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } } }} />}
            </Card>
          </div>

          <div className="grid grid-cols-2 gap-4 mb-4">
            <StatCard icon={ICONS.check} label="Taxa de Presença" value={presencaPct(tot) === null ? "—" : `${presencaPct(tot)}%`} sub={`mês ${selMonth}`} iconBg="#e6f9f0" iconColor="#10b981" />
            <StatCard icon={ICONS.users} label="Custo Backups" value={fmtEUR(custoBackups)} sub="registos da aba Backups" iconBg="#f5f3ff" iconColor="#8b5cf6" />
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
            <StatCard icon={ICONS.store} label="Loja + Faltas" value={extra.lojaMax[0]} sub={`${extra.lojaMax[1]} ausências`} iconBg="#eef1ff" iconColor="#4f6ef7" />
            <StatCard icon={ICONS.dashboard} label="Loja − Faltas" value={extra.lojaMin[0]} sub={`${extra.lojaMin[1]} ausências`} iconBg="#eef1ff" iconColor="#4f6ef7" />
            <StatCard icon={ICONS.userX} label="Operador + Faltas" value={extra.opMax[1] > 0 ? extra.opMax[0] : "—"} sub={`${extra.opMax[1]} faltas`} iconBg="#f5f3ff" iconColor="#8b5cf6" />
          </div>

          <div className="grid md:grid-cols-2 gap-5 mb-5">
            <Card title="Faltas por Loja (todas as ausências)">
              {faltasPorLojaChart.labels.length === 0 ? <div className="h-[240px] flex items-center justify-center text-gray-300 text-sm">Sem dados</div> :
                <ChartCanvas type="bar" data={faltasPorLojaChart} options={barStackOpts} />}
            </Card>
            <Card title="Distribuição de Status">
              <ChartCanvas type="doughnut" data={distribChart} options={{ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right", labels: { boxWidth: 10, font: { size: 11 } } } } }} />
            </Card>
          </div>

          <div className="grid md:grid-cols-2 gap-5">
            <Card title="Evolução Semanal">
              <ChartCanvas type="line" data={weeklyLineChart} options={{ responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }} />
            </Card>
            <Card title="Heatmap · Faltas por Dia da Semana">
              <div className="grid grid-cols-7 gap-2 mt-4">
                {DIAS_SEMANA.map((d, i) => (
                  <div key={d} className="text-center">
                    <div className="text-[11px] text-gray-400 font-semibold mb-1.5">{d}</div>
                    <div className="rounded-lg h-16 flex items-center justify-center text-sm font-bold"
                      style={{ background: `rgba(239,68,68,${0.12 + 0.75 * (heatmap[i] / maxHeat)})`, color: heatmap[i] > maxHeat * 0.55 ? "#fff" : "#991b1b" }}>
                      {heatmap[i]}
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </>
      )}

      {!loading && data.status === "ready" && tab === "mensal" && (
        <MonthlyComparativeTab months={months} recs={recs} bks={bks} monthHasData={data.monthHasData} selMonth={selMonth} />
      )}

      {!loading && data.status === "ready" && tab === "semanal" && !monthEmpty && (
        <WeeklyTab mk={selMonth} monthLabel={monthLabel} weeks={weeks} weeklyStackChart={weeklyStackChart} recs={monthRecs} />
      )}
    </div>
  );
}

const varBadge = (delta, pct, inverse = true) => {
  if (delta === null || delta === undefined) return <span className="text-gray-400">—</span>;
  if (delta === 0) return <span className="text-gray-400">= 0</span>;
  const bad = inverse ? delta > 0 : delta < 0; // faltas a subir = mau; presença a descer = mau
  return <span style={{ color: bad ? "#ef4444" : "#10b981", fontWeight: 700 }}>{delta > 0 ? "▲" : "▼"} {Math.abs(delta)}{pct !== null && pct !== undefined ? ` (${pct > 0 ? "+" : ""}${pct}%)` : ""}</span>;
};

function MonthlyComparativeTab({ months, recs, bks, monthHasData, selMonth }) {
  const rows = useMemo(() => months.map((mk) => {
    const has = !!monthHasData[mk];
    const c = countRecs(recs.filter((r) => r.mk === mk));
    const mb = bks.filter((b) => (b.data || "").startsWith(mk));
    return { mk, has, c, regInt: mb.filter((b) => b.tipo !== "Externo").length, regExt: mb.filter((b) => b.tipo === "Externo").length, pres: has ? presencaPct(c) : null };
  }), [months, recs, bks, monthHasData]);

  const labels = rows.map((r) => monthShort(r.mk));
  const v = (fn) => rows.map((r) => (r.has ? fn(r) : null));
  const faltasChart = { labels, datasets: [
    { label: "Falta", data: v((r) => r.c.falta), backgroundColor: "#ef4444" },
    { label: "Meia Falta", data: v((r) => r.c.meia), backgroundColor: "#f59e0b" },
    { label: "Abandono", data: v((r) => r.c.abandono), backgroundColor: "#7f1d1d" },
  ] };
  const semBkpChart = { labels, datasets: [
    { label: "Faltas c/ Backup Interno", data: v((r) => r.c.cInt), backgroundColor: "#14b8a6" },
    { label: "Faltas c/ Backup Externo", data: v((r) => r.c.cExt), backgroundColor: "#fbbf24" },
    { label: "Faltas sem Backup", data: v((r) => r.c.sem), backgroundColor: "#ef4444" },
  ] };
  const presChart = { labels, datasets: [{ label: "Presença %", data: rows.map((r) => r.pres), borderColor: "#10b981", backgroundColor: "rgba(16,185,129,0.12)", fill: true, tension: 0.35, spanGaps: false }] };
  const anyData = rows.some((r) => r.has);

  if (!anyData) return <StateBox status="ready" empty emptyText="Sem dados na grelha para os últimos 6 meses." />;

  return (
    <div>
      <p className="text-xs text-gray-400 mb-3">Últimos {months.length} meses até {monthLabelOf(selMonth)}. Meses sem dados na grelha aparecem como lacuna (não como zero).</p>
      <div className="grid md:grid-cols-2 gap-5 mb-5">
        <Card title="Faltas · Meias Faltas · Abandonos"><ChartCanvas type="bar" data={faltasChart} options={barStackOpts} /></Card>
        <Card title="Taxa de Presença"><ChartCanvas type="line" data={presChart} options={{ responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false, suggestedMin: 80, suggestedMax: 100, ticks: { callback: (val) => val + "%" } } } }} /></Card>
        <Card title="Faltas com Backup Interno · Externo · Sem Backup"><ChartCanvas type="bar" data={semBkpChart} options={barGroupOpts} /></Card>
      </div>
      <Card title="Variação entre meses">
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[820px]">
            <thead>
              <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                {["Mês", "Faltas", "Meias", "Abandonos", "Total", "Var. total", "Presença", "Var. presença", "Faltas c/ Bkp Int.", "Faltas c/ Bkp Ext.", "Sem backup"].map((h, i) => <th key={h} className={`px-3 py-2 border-b border-[var(--border-c)] ${i === 0 ? "text-left" : ""}`}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                const prev = i > 0 ? rows[i - 1] : null;
                const t = totalFaltas(r.c);
                const pt = prev && prev.has ? totalFaltas(prev.c) : null;
                const dT = r.has && pt !== null ? t - pt : null;
                const pctT = dT !== null && pt > 0 ? Math.round((dT / pt) * 100) : null;
                const dP = r.has && prev && prev.pres !== null && r.pres !== null ? Math.round((r.pres - prev.pres) * 10) / 10 : null;
                const td = "px-3 py-2 border-b border-[var(--border-c)] text-center tabular-nums";
                return (
                  <tr key={r.mk} className={r.mk === selMonth ? "bg-gray-50" : ""}>
                    <td className="px-3 py-2 border-b border-[var(--border-c)] font-bold whitespace-nowrap">{monthLabelOf(r.mk)}</td>
                    {r.has ? <>
                      <td className={td}>{r.c.falta}</td><td className={td}>{r.c.meia}</td><td className={td}>{r.c.abandono}</td>
                      <td className={td + " font-extrabold"}>{t}</td>
                      <td className={td}>{varBadge(dT, pctT, true)}</td>
                      <td className={td}>{r.pres === null ? "—" : `${r.pres}%`}</td>
                      <td className={td}>{varBadge(dP, null, false)}</td>
                      <td className={td}>{r.c.cInt}</td><td className={td}>{r.c.cExt}</td><td className={td}>{r.c.sem}</td>
                    </> : <td colSpan={10} className="px-3 py-2 border-b border-[var(--border-c)] text-center text-gray-400">Sem dados na grelha</td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function WeekMatrix({ weeks, recs }) {
  const [open, setOpen] = useState({});
  const rows = useMemo(() => {
    const cmap = new Map();
    recs.forEach((r) => {
      if (!ABS_TYPES.includes(r.st)) return;
      const ck = r.clientId || "_none";
      let c = cmap.get(ck);
      if (!c) { c = { id: ck, nome: r.client, w: {}, tot: 0, stores: new Map() }; cmap.set(ck, c); }
      c.w[r.wk] = (c.w[r.wk] || 0) + 1; c.tot++;
      const sk = r.storeId || "_none";
      let s = c.stores.get(sk);
      if (!s) { s = { id: sk, nome: r.store, w: {}, tot: 0 }; c.stores.set(sk, s); }
      s.w[r.wk] = (s.w[r.wk] || 0) + 1; s.tot++;
    });
    const cmp = (a, b) => b.tot - a.tot || a.nome.localeCompare(b.nome);
    return [...cmap.values()].map((c) => ({ ...c, stores: [...c.stores.values()].sort(cmp) })).sort(cmp);
  }, [recs]);
  const max = Math.max(1, ...rows.flatMap((c) => weeks.map((w) => c.w[w.wk] || 0)));
  if (!rows.length) return <div className="text-sm text-gray-400 py-4 text-center">Sem faltas registadas neste mês.</div>;
  const cell = (n) => (
    <td className="px-1 py-1 border-b border-[var(--border-c)] text-center">
      <div className="rounded-md h-7 flex items-center justify-center font-bold tabular-nums" style={n ? { background: `rgba(239,68,68,${0.12 + 0.75 * (n / max)})`, color: n / max > 0.55 ? "#fff" : "#991b1b" } : { color: "#9ca3af" }}>{n}</div>
    </td>
  );
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-xs" style={{ minWidth: 300 + weeks.length * 70 }}>
        <thead>
          <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Cliente / Loja</th>
            {weeks.map((w) => <th key={w.wk} className="px-2 py-2 border-b border-[var(--border-c)] whitespace-nowrap" title={w.label}>S{w.idx}</th>)}
            <th className="px-2 py-2 border-b border-[var(--border-c)]">Total</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((c) => (
            <React.Fragment key={c.id}>
              <tr className="cursor-pointer hover:bg-gray-50/60" onClick={() => setOpen((p) => ({ ...p, [c.id]: !p[c.id] }))}>
                <td className="px-3 py-1 border-b border-[var(--border-c)] font-bold">
                  <span className="inline-flex items-center gap-2"><span className="text-gray-400" style={{ display: "inline-flex", transform: open[c.id] ? "rotate(0deg)" : "rotate(-90deg)" }}><Icon path={ICONS.chevronDown} size={14} /></span>{c.nome}</span>
                </td>
                {weeks.map((w) => <React.Fragment key={w.wk}>{cell(c.w[w.wk] || 0)}</React.Fragment>)}
                <td className="px-2 py-1 border-b border-[var(--border-c)] text-center font-extrabold">{c.tot}</td>
              </tr>
              {open[c.id] && c.stores.map((s) => (
                <tr key={c.id + s.id} className="bg-gray-50">
                  <td className="px-3 py-1 border-b border-[var(--border-c)]" style={{ paddingLeft: 34 }}>{s.nome}</td>
                  {weeks.map((w) => <React.Fragment key={w.wk}>{cell(s.w[w.wk] || 0)}</React.Fragment>)}
                  <td className="px-2 py-1 border-b border-[var(--border-c)] text-center font-bold">{s.tot}</td>
                </tr>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function WeeklyTab({ mk, monthLabel, weeks, weeklyStackChart, recs }) {

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <MiniStat label="Faltas no mês" value={sum} sub="Falta + Meia + Abandono" color="#ef4444" />
        <MiniStat label="Média por semana" value={weeks.length ? (Math.round((sum / weeks.length) * 10) / 10).toString().replace(".", ",") : "0"} sub={`${weeks.length} semanas (seg–dom)`} />
        <MiniStat label="Semana de pico" value={peaks.length ? peaks.map((w) => `S${w.idx}`).join(", ") : "—"} sub={peaks.length ? `${maxT} ocorrências` : "sem faltas"} color="#f59e0b" />
        <MiniStat label="Sem backup" value={weeks.reduce((a, w) => a + w.c.sem, 0)} sub="faltas sem cobertura" color="#ef4444" />

      <div className="grid lg:grid-cols-2 gap-5 mb-5">
        <Card title={`Faltas por semana · ${monthLabel}`}>
          <ChartCanvas type="bar" data={weeklyStackChart} options={barStackOpts} height={300} />
        </Card>
        <Card title="Detalhe semanal">
          <div className="overflow-x-auto">
            <table className="w-full text-xs min-w-[520px]">
              <thead>
                <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                  {["Semana", "Faltas", "Meias", "Aband.", "Total", "Sem bkp", "Var."].map((h, i) => <th key={h} className={`px-2 py-2 border-b border-[var(--border-c)] ${i === 0 ? "text-left" : ""}`}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {weeks.map((w, i) => {
                  const t = totals[i];
                  const d = i > 0 ? t - totals[i - 1] : null;
                  const isPeak = maxT > 0 && t === maxT;
                  const td = "px-2 py-2 border-b border-[var(--border-c)] text-center tabular-nums";
                  return (
                    <tr key={w.wk} className={isPeak ? "bg-red-50" : ""}>
                      <td className="px-2 py-2 border-b border-[var(--border-c)] font-semibold whitespace-nowrap">{w.label}{isPeak && <span className="ml-2"><Pill color="#ef4444">Pico</Pill></span>}</td>
                      <td className={td}>{w.c.falta}</td><td className={td}>{w.c.meia}</td><td className={td}>{w.c.abandono}</td>
                      <td className={td + " font-extrabold"}>{t}</td><td className={td}>{w.c.sem}</td>
                      <td className={td}>{varBadge(d, null, true)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      </div>
      <Card title="Faltas por semana · Cliente e Loja" right={<span className="text-[11px] text-gray-400">Clique num cliente para ver as lojas</span>}>
        <WeekMatrix weeks={weeks} recs={recs} />
      </Card>
    </div>
  );
}
